        VC.views.login.render(root);
      });
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (f.next.value !== f.again.value) return VC.showFieldErrors(f, { again: 'The two passwords do not match.' });
        const btn = $('button.primary', f);
        btn.disabled = true;
        try {
          await api('POST', '/api/me/password', { current: f.current.value, next: f.next.value });
          const { user } = await api('GET', '/api/me');
          VC.toast('Password saved');
          VC.signedIn(user);
        } catch (err) {
          VC.showFieldErrors(f, err.data?.fields || {});
          if (!err.data?.fields) VC.fail(err);
        } finally { btn.disabled = false; }
      });
      f.current.focus();
      return;
    }

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('button.primary', f);
      btn.disabled = true;
      $('#msg').innerHTML = '';
      try {
        const { user } = await api('POST', '/api/login', { username: f.username.value, password: f.password.value });
        if (!location.hash || location.hash === '#/') location.hash = '';
        VC.signedIn(user);
      } catch (err) {
        render($('#msg'), html`<div class="form-error">${err.message}</div>`);
        f.password.select();
      } finally { btn.disabled = false; }
    });
    f.username.focus();
  },
};

'use strict';
(() => {
  const { $, $$, html, raw, render, fmt, api, toast, fail } = VC;

  const TYPES = {
    Income: { sub: 'Money received', receipt: 'OR', party: 'Payor', partyPh: 'Who paid', partPh: 'e.g. Training fee – Cookery NC II', refPh: 'OR / AR no.' },
    Expense: { sub: 'Money paid out', receipt: 'Receipt', party: 'Payee', partyPh: 'Store or person paid', partPh: 'e.g. Gasoline for service vehicle', refPh: 'PCV-0001' },
    'Cash Advance': { sub: 'Released before the expense', receipt: 'Voucher', party: 'Released to', partyPh: 'Staff who received it', partPh: 'e.g. Consumables for Cookery NC II', refPh: 'CA-0001' },
    Liquidation: { sub: 'Receipt for an advance', receipt: 'OR', party: 'Payee', partyPh: 'Store on the receipt', partPh: 'What was bought', refPh: '' },
    Return: { sub: 'Unspent advance back', receipt: 'None', party: 'Returned by', partyPh: 'Staff returning the cash', partPh: 'Unspent cash advance returned', refPh: '' },
    Replenishment: { sub: 'Petty cash topped up', receipt: 'Voucher', party: 'Source', partyPh: 'e.g. Main office', partPh: 'e.g. Petty cash replenishment', refPh: 'Voucher / check no.' },
  };
  const RECEIPTS = { OR: 'Official Receipt (OR)', AR: 'Acknowledgment (AR)', Receipt: 'Ordinary receipt', Voucher: 'Voucher', None: 'None' };
  const LINKED = (t) => t === 'Liquidation' || t === 'Return';

  function signedAmount(t) {
    if (t.type === 'Income') return html`<span class="num in">+${t.amount}</span>`;
    if (t.type === 'Return' || t.type === 'Replenishment') return html`<span class="num">+${t.amount}</span>`;
    if (t.type === 'Liquidation') return html`<span class="num out">${t.amount}</span>`;
    return html`<span class="num out">-${t.amount}</span>`;
  }
  VC.signedAmount = signedAmount;

  VC.views.encode = {
    narrow: true,
    async render(main, [editId], query) {
      const meta = VC.state.meta;
      if (!meta.opening) {
        render(main, html`<div class="card pad empty"><b>Set the starting petty cash first</b>
          The system needs the cash on hand on the day before your first entry.<div style="margin-top:16px"><a class="btn primary" href="#/settings">Set starting balance</a></div></div>`);
        return;
      }
      let editing = null;
      let history = [];
      if (editId) {
        const r = await api('GET', `/api/transactions/${+editId}`);
        editing = r.txn;
        history = r.history;
        if (editing.voided) {
          render(main, html`<div class="card pad empty"><b>This entry was removed</b>Reason: ${editing.void_reason}<div style="margin-top:16px"><a class="btn" href="#/sheet">Back to the Encoding Sheet</a></div></div>`);
          return;
        }
      }
      let advances = (await api('GET', '/api/advances/open')).rows;

      const s = editing ? {
        type: editing.type, receipt: editing.receipt, txn_date: editing.txn_date, ref_no: editing.ref_no,
        amount: editing.amount, particulars: editing.particulars, party: editing.party, category_id: editing.category_id,
      } : {
        type: TYPES[query.get('type')] ? query.get('type') : 'Expense',
        receipt: '', txn_date: meta.today, ref_no: query.get('ref') || '', amount: '', particulars: '', party: '', category_id: '',
      };
      if (!s.receipt) s.receipt = TYPES[s.type].receipt;
      const cats = (kind) => meta.categories.filter((c) => c.kind === kind && (c.active || c.id === s.category_id));

      render(main, html`
        <div class="grid-2">
          <section class="card pad" style="padding:32px 28px 28px">
            <h1 style="font-size:30px">${editing ? 'Edit an entry' : 'Encode a transaction'}</h1>
            <p class="muted" style="margin:6px 0 0">${editing
              ? html`Encoded ${fmt.when(editing.encoded_at)}${editing.late ? ' · late' : ''}. Every change is kept in the Change Log with your name.`
              : 'Use the date written on the receipt — it\'s fine to encode days or weeks later.'}</p>
            <form id="ef" novalidate>
              <div class="step">1 · What happened?</div>
              <div class="type-grid" id="types"></div>
              <div class="step">2 · What document is behind it?</div>
              <div class="chips" id="receipts"></div>
              <div class="step">3 · Details</div>
              <div class="field-grid" id="fields"></div>
              ${editing ? html`<div style="margin-top:18px"><label class="f" for="reason">Reason for the change</label>
                <input class="input" id="reason" name="reason" placeholder="e.g. typo, amount now matches the receipt" autocomplete="off"><div class="err" data-for="reason"></div></div>` : ''}
              <div class="form-actions">
                ${editing ? html`<button type="button" class="btn danger left" id="void">Remove entry</button>
                  <a class="btn" href="#/sheet?month=${editing.txn_date.slice(0, 7)}">Cancel</a>
                  <button class="btn primary big" id="save">Save changes</button>`
                : html`<button type="button" class="btn big" id="clear">Clear</button>
                  <button class="btn primary big" id="save">Save &amp; encode another</button>`}
              </div>
            </form>
          </section>
          <aside class="stack">
            <section class="card dark goes" id="goes"></section>
            <section class="card recent" id="side"></section>
          </aside>
        </div>`);

      const form = $('#ef');

      function drawTypes() {
        render($('#types'), Object.entries(TYPES).map(([k, v]) => html`<button type="button" class="type-card ${s.type === k ? 'on' : ''}" data-type="${k}" aria-pressed="${s.type === k}"><b>${k}</b><span>${v.sub}</span></button>`));
      }
      function drawReceipts() {
        render($('#receipts'), Object.entries(RECEIPTS).map(([k, v]) => html`<button type="button" class="chip ${s.receipt === k ? 'on' : ''}" data-receipt="${k}" aria-pressed="${s.receipt === k}">${v}</button>`));
      }
      function refField() {
        const T = TYPES[s.type];
        if (LINKED(s.type)) {
          const opts = [...advances];
          if (s.ref_no && !opts.some((a) => a.ref === s.ref_no)) opts.unshift({ ref: s.ref_no, particulars: '(this entry\'s advance)', balance: '' });
          if (!opts.length) return html`<select class="input" name="ref_no" disabled><option>No outstanding advance</option></select>`;
          return html`<select class="input mono" name="ref_no"><option value="">Choose the CA no.</option>${opts.map((a) => html`<option value="${a.ref}" ${a.ref === s.ref_no ? 'selected' : ''}>${a.ref}${a.balance ? ` · ${a.balance} left` : ''}</option>`)}</select>`;
        }
        return html`<input class="input mono" name="ref_no" value="${s.ref_no}" placeholder="${T.refPh}" autocomplete="off">`;
      }
      function categoryField() {
        const kind = meta.type_kind[s.type];
        if (kind === 'advance' || kind === 'other') {
          const c = meta.categories.find((x) => x.kind === kind);
          return html`<select class="input" name="category_id" disabled><option>${c?.name || ''}</option></select>`;
        }
        const list = cats(kind);
        return html`<select class="input" name="category_id"><option value="">Choose…</option>${list.map((c) => html`<option value="${c.id}" ${+s.category_id === c.id ? 'selected' : ''}>${c.name}</option>`)}</select>`;
      }
      function drawFields() {
        const T = TYPES[s.type];
        render($('#fields'), html`
          <div><label class="f" for="d">Date on receipt</label><input class="input" id="d" type="date" name="txn_date" value="${s.txn_date}" min="${meta.opening.first_day}" max="${meta.today}"><div class="err" data-for="txn_date"></div></div>
          <div><label class="f">${LINKED(s.type) ? 'Cash advance no.' : 'Ref. no.'}</label>${refField()}<div class="err" data-for="ref_no"></div></div>
          <div><label class="f" for="amt">Amount</label><input class="input num" id="amt" name="amount" value="${s.amount}" inputmode="decimal" placeholder="0.00" autocomplete="off"><div class="err" data-for="amount"></div></div>
          <div><label class="f" for="pt">Particulars</label><input class="input" id="pt" name="particulars" value="${s.particulars}" placeholder="${T.partPh}" maxlength="200"><div class="err" data-for="particulars"></div></div>
          <div><label class="f" for="py">${T.party}</label><input class="input" id="py" name="party" value="${s.party}" placeholder="${T.partyPh}" maxlength="120"><div class="err" data-for="party"></div></div>
          <div><label class="f">Category</label>${categoryField()}<div class="err" data-for="category_id"></div></div>`);
        if (LINKED(s.type) && !advances.length) {
          $('[data-for=ref_no]', form).textContent = 'Every cash advance is already settled.';
        }
      }
      const drawAll = () => { drawTypes(); drawReceipts(); drawFields(); preview(); };

      async function setType(t) {
        const prev = s.type;
        s.type = t;
        s.receipt = TYPES[t].receipt;
        if (!editing) {
          if (t === 'Expense' || t === 'Cash Advance') s.ref_no = meta.next_ref[t];
          else if (LINKED(t)) s.ref_no = advances.length === 1 ? advances[0].ref : '';
          else if (prev === 'Expense' || prev === 'Cash Advance' || LINKED(prev)) s.ref_no = '';
          if (t === 'Return') {
            s.particulars = s.particulars || 'Unspent cash advance returned';
            const a = advances.find((x) => x.ref === s.ref_no);
            if (a && !s.party) s.party = a.party;
          }
        }
        if (meta.type_kind[t] !== meta.type_kind[prev]) s.category_id = '';
        drawAll();
      }

      $('#types').addEventListener('click', (e) => { const b = e.target.closest('[data-type]'); if (b) setType(b.dataset.type); });
      $('#receipts').addEventListener('click', (e) => {
        const b = e.target.closest('[data-receipt]');
        if (!b) return;
        s.receipt = b.dataset.receipt;
        drawReceipts();
        preview();
      });
      form.addEventListener('input', (e) => {
        const n = e.target.name;
        if (n && n in s) s[n] = e.target.value;
        preview();
      });
      form.addEventListener('change', (e) => {
        const n = e.target.name;
        if (n && n in s) s[n] = e.target.value;
        if (n === 'ref_no' && s.type === 'Return') {
          const a = advances.find((x) => x.ref === s.ref_no);
          if (a) { s.party = s.party || a.party; if (!s.amount) s.amount = a.balance; drawFields(); }
        }
        if (n === 'amount') {
          const c = fmt.toCents(s.amount);
          if (Number.isFinite(c)) { s.amount = fmt.cents(c); e.target.value = s.amount; }
        }
        preview();
      });

      // ------------------------------------------------ where this entry goes
      let pvTimer = null;
      let pvSeq = 0;
      function preview() {
        clearTimeout(pvTimer);
        pvTimer = setTimeout(async () => {
          const seq = ++pvSeq;
          const body = { ...s, id: editing?.id };
          const ready = s.txn_date && s.amount && Number.isFinite(fmt.toCents(s.amount)) && fmt.toCents(s.amount) > 0;
          if (!ready) return drawGoes(null);
          try {
            const r = await api('POST', '/api/transactions/preview', { ...body, ref_no: s.ref_no || 'X', particulars: s.particulars || 'x', category_id: s.category_id });
            if (seq === pvSeq) drawGoes(r.ok ? r.preview : null, r.fields);
          } catch { /* not important */ }
        }, 220);
      }
      function drawGoes(p, fields) {
        const el = $('#goes');
        if (!p) {
          const missing = fields?.category_id ? 'Choose a category to see where this entry lands.' : fields?.txn_date || 'Fill in the date and amount to see where this entry lands.';
          render(el, html`<h2>Where this entry goes</h2><div class="inset off"><div class="line">${missing}</div></div>
            <p>The Daily Cashflow, the Financial Report and every balance after it update on their own.</p>`);
          return;
        }
        const d = fmt.short(s.txn_date);
        const cf = p.cashflow.section
          ? html`<div class="inset"><small>Daily Cashflow · ${d}</small><div class="line">${p.cashflow.section}, under ${p.cashflow.category}<span class="amt">${p.cashflow.signed}</span></div></div>`
          : html`<div class="inset off"><small>Daily Cashflow · ${d}</small><div class="line">${p.cashflow.note}</div></div>`;
        const rep = p.report.skip
          ? html`<div class="inset off"><small>Financial Report</small><div class="line">${p.report.skip}</div></div>`
          : html`<div class="inset"><small>Financial Report · ${p.report.month}${p.report.year !== meta.today.slice(0, 4) ? ' ' + p.report.year : ''}</small><div class="line">${p.report.category} column<span class="amt">${p.report.signed}</span></div></div>`;
        const bal = p.balance
          ? (p.balance.counted
            ? html`<div class="inset"><small>Cash on hand · ${d}</small><div class="line" style="font-size:14px">The cash for ${d} was already counted, so this shows up as a cash over / short on that day.</div></div>`
            : html`<div class="inset"><small>Cash on hand from ${d} onward</small><div class="bal">${p.balance.before} → <b>${p.balance.after}</b></div></div>`)
          : '';
        const foot = editing ? `Saving updates the ${d} Cashflow and every balance after it.`
          : p.balance?.until ? `Saving updates the ${d} Cashflow and the balances up to the next cash count on ${fmt.short(p.balance.until)}.`
            : p.cashflow.section ? `Saving updates the ${d} Cashflow and every balance after it.` : 'Saving records it against the advance; no balance changes.';
        render(el, html`<h2>Where this entry goes</h2>${cf}${rep}${bal}<p>${foot}</p>`);
      }

      // ------------------------------------------------ side card
      async function drawSide() {
        const el = $('#side');
        if (editing) {
          render(el, html`<div class="recent-head"><h2>History of this entry</h2></div>
            ${history.length ? history.map((h) => html`<div class="recent-row" style="display:block"><b>${h.short_name || 'System'} ${h.text} ${h.ref}</b>
              <small>${h.detail.replace(/\s·\s#\d+$/, '')}</small><small>${fmt.when(h.at)}</small></div>`)
            : html`<div class="recent-row"><small>Encoded ${fmt.when(editing.encoded_at)}. No changes yet.</small></div>`}`);
          return;
        }
        const { rows } = await api('GET', '/api/transactions/recent');
        render(el, html`<div class="recent-head"><h2>Recently encoded</h2><a href="#/sheet" class="link-btn">Open sheet</a></div>
          ${rows.length ? rows.map((t) => html`<a class="recent-row" href="#/encode/${t.id}">
              <div><b>${t.particulars}</b><small>${t.type} · ${t.ref_no} · ${fmt.short(t.txn_date)}${t.late ? ' · late' : ''}</small></div>${signedAmount(t)}</a>`)
            : html`<div class="empty" style="padding:30px 0">Nothing encoded yet.</div>`}`);
      }

      // ------------------------------------------------ save
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#save');
        btn.disabled = true;
        VC.showFieldErrors(form, {});
        try {
          const body = { ...s };
          if (editing) {
            body.reason = $('#reason').value;
            const r = await VC.saveWithConfirm((confirm) => api('PUT', `/api/transactions/${editing.id}`, { ...body, confirm }));
            if (!r) return;
            toast(r.unchanged ? 'Nothing was changed' : `Saved changes to ${s.ref_no}`);
            location.hash = `#/sheet?month=${s.txn_date.slice(0, 7)}`;
            return;
          }
          const r = await VC.saveWithConfirm((confirm) => api('POST', '/api/transactions', { ...body, confirm }));
          if (!r) return;
          toast(`Saved ${r.txn.type} ${r.txn.ref_no} · ${r.txn.amount}`);
          await VC.loadMeta();
          advances = (await api('GET', '/api/advances/open')).rows;
          Object.assign(s, { amount: '', particulars: '', party: '', ref_no: '' });
          if (s.type === 'Expense' || s.type === 'Cash Advance') s.ref_no = VC.state.meta.next_ref[s.type];
          if (LINKED(s.type)) s.ref_no = '';
          if (s.type === 'Return') s.particulars = 'Unspent cash advance returned';
          Object.assign(meta, VC.state.meta);
          drawAll();
          drawSide();
          $('#amt').focus();
        } catch (err) {
          if (err.data?.fields) {
            VC.showFieldErrors(form, err.data.fields);
            const firstBad = $('.bad', form);
            firstBad?.focus();
          } else fail(err);
        } finally { btn.disabled = false; }
      });

      $('#clear')?.addEventListener('click', () => {
        Object.assign(s, { amount: '', particulars: '', party: '', category_id: '', txn_date: meta.today });
        if (s.type === 'Expense' || s.type === 'Cash Advance') s.ref_no = meta.next_ref[s.type];
        else s.ref_no = '';
        VC.showFieldErrors(form, {});
        drawAll();
      });

      $('#void')?.addEventListener('click', async () => {
        const reason = await VC.promptDialog({
          title: 'Remove this entry?',
          body: `${editing.type} ${editing.ref_no} · ${editing.amount}. It disappears from the Cashflow and the Financial Report, but stays in the Change Log.`,
          label: 'Reason', placeholder: 'e.g. encoded twice', ok: 'Remove entry', danger: true,
        });
        if (!reason) return;
        try {
          await api('POST', `/api/transactions/${editing.id}/void`, { reason });
          toast('Entry removed');
          location.hash = `#/sheet?month=${editing.txn_date.slice(0, 7)}`;
        } catch (err) { fail(err); }
      });

      if (!editing) {
        if (!s.ref_no && (s.type === 'Expense' || s.type === 'Cash Advance')) s.ref_no = meta.next_ref[s.type];
        if (LINKED(s.type) && !s.ref_no && advances.length === 1) s.ref_no = advances[0].ref;
        if (s.type === 'Return') {
          s.particulars = 'Unspent cash advance returned';
          const a = advances.find((x) => x.ref === s.ref_no);
          if (a) { s.party = a.party; s.amount = a.balance; }
        }
      }
      drawAll();
      drawSide();
      if (editing) $('#reason').focus();
    },
  };
})();

'use strict';
(() => {
  const { $, html, raw, render, fmt, api, icon } = VC;
  const RECEIPT_SHORT = { OR: 'OR', AR: 'AR', Receipt: 'Receipt', Voucher: 'Voucher', None: 'None' };
  const FILTERS = [['', 'All'], ['Income', 'Income'], ['Expense', 'Expense'], ['Cash Advance', 'Cash Advance'], ['Liquidation', 'Liquidation'], ['late', 'Encoded late']];

  function monthsBetween(from, to) {
    const out = [];
    let [y, m] = from.split('-').map(Number);
    const [ty, tm] = to.split('-').map(Number);
    while (y < ty || (y === ty && m <= tm)) { out.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } }
    return out.reverse();
  }

  function csv(rows) {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const head = ['Date', 'Type', 'Receipt', 'Ref. no.', 'Particulars', 'Payee / Payor', 'Category', 'Amount', 'In report', 'Encoded on'];
    const lines = [head.map(q).join(',')];
    for (const t of rows) lines.push([t.txn_date, t.type, t.receipt, t.ref_no, t.particulars, t.party, t.category, (t.amount_c / 100).toFixed(2), t.in_report, t.encoded_at.replace('T', ' ')].map(q).join(','));
    return '﻿' + lines.join('\r\n');
  }

  VC.views.sheet = {
    async render(main, _, query) {
      const meta = VC.state.meta;
      const today = meta.today;
      const f = { month: query.get('month') || today.slice(0, 7), type: '', late: false, q: '' };
      const first = meta.opening ? meta.opening.first_day.slice(0, 7) : today.slice(0, 7);
      const months = monthsBetween(first < f.month ? first : f.month, today.slice(0, 7) > f.month ? today.slice(0, 7) : f.month);

      render(main, html`
        <div class="page-head">
          <div><h1>Encoding Sheet</h1><p>Every transaction, entered once. Gray columns are filled in by the system.</p></div>
          <div class="actions">
            <button class="btn" id="csv" title="Download this month as a spreadsheet file">Download CSV</button>
            ${VC.can.encode() ? html`<a class="btn primary" href="#/encode">+ Encode a transaction</a>` : ''}
          </div>
        </div>
        <div class="toolbar">
          <label class="pill-select"><span class="sr">Month</span><select id="month">${months.map((m) => html`<option value="${m}" ${m === f.month ? 'selected' : ''}>${fmt.month(m)}</option>`)}</select></label>
          <div class="chips" id="filters">${FILTERS.map(([k, l]) => html`<button class="chip sm ${k === '' ? 'on' : ''}" data-f="${k}">${l}</button>`)}</div>
          <label class="search"><span class="sr">Search</span>${raw(icon.search)}<input class="input" id="q" placeholder="Ref no., payee, particulars" autocomplete="off"></label>
        </div>
        <section class="card table-wrap" id="table"></section>
        <div class="stats" id="sum" style="margin-top:20px"></div>`);

      let data = null;
      async function load() {
        const p = new URLSearchParams({ month: f.month, type: f.type, late: f.late ? '1' : '', q: f.q });
        data = await api('GET', `/api/transactions?${p}`);
        draw();
      }
      function draw() {
        const editable = VC.can.encode();
        render($('#table'), data.rows.length ? html`
          <table class="t">
            <thead><tr><th>Date</th><th>Type</th><th>Receipt</th><th>Ref. no.</th><th>Particulars</th><th>Payee / Payor</th><th>Category</th><th class="num">Amount</th><th class="auto">In report</th><th class="auto">Encoded on</th>${editable ? html`<th></th>` : ''}</tr></thead>
            <tbody>${data.rows.map((t) => html`
              <tr class="${editable ? 'clickable' : ''}" data-id="${t.id}">
                <td style="white-space:nowrap">${fmt.short(t.txn_date)}</td>
                <td><span class="badge b-${t.type.replace(' ', '-')}">${t.type}</span></td>
                <td>${RECEIPT_SHORT[t.receipt]}</td>
                <td class="mono" style="white-space:nowrap">${t.ref_no}</td>
                <td>${t.particulars}</td>
                <td>${t.party}</td>
                <td>${t.category}</td>
                <td class="num mono">${t.amount}</td>
                <td class="auto">${t.in_report}</td>
                <td class="auto" style="white-space:nowrap">${fmt.short(t.encoded_on)}${t.late ? html`<span class="badge late">late</span>` : ''}</td>
                ${editable ? html`<td><button class="edit-btn" title="Edit" aria-label="Edit ${t.ref_no}">${raw(icon.pencil)}</button></td>` : ''}
              </tr>`)}</tbody>
          </table>` : html`<div class="empty"><b>No entries${f.type || f.late || f.q ? ' match' : ''}</b>${f.type || f.late || f.q ? 'Try another filter or search.' : `Nothing has been encoded for ${fmt.month(f.month)} yet.`}</div>`);
        const s = data.summary;
        render($('#sum'), html`
          <div class="stat"><small>Income in report</small><div class="v in">${s.income}</div></div>
          <div class="stat"><small>Expenses in report</small><div class="v out">${s.expenses}</div></div>
          <div class="stat"><small>AR collections (cashflow only)</small><div class="v">${s.ar}</div></div>
          <div class="stat dark"><small>Cash on hand${s.on_hand ? ` · ${fmt.short(s.on_hand.day)}` : ''}</small><div class="v">${s.on_hand ? s.on_hand.amount : '—'}</div></div>`);
      }

      $('#month').addEventListener('change', (e) => { f.month = e.target.value; history.replaceState(null, '', `#/sheet?month=${f.month}`); load(); });
      $('#filters').addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        const k = b.dataset.f;
        if (k === 'late') { f.late = !f.late; b.classList.toggle('on', f.late); }
        else {
          f.type = k;
          document.querySelectorAll('#filters [data-f]').forEach((x) => { if (x.dataset.f !== 'late') x.classList.toggle('on', x.dataset.f === k); });
        }
        load();
      });
      let qt;
      $('#q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { f.q = e.target.value; load(); }, 250); });
      $('#table').addEventListener('click', (e) => {
        const tr = e.target.closest('tr[data-id]');
        if (tr && VC.can.encode()) location.hash = `#/encode/${tr.dataset.id}`;
      });
      $('#csv').addEventListener('click', async () => {
        const all = await api('GET', `/api/transactions?month=${f.month}`);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv(all.rows)], { type: 'text/csv' }));
        a.download = `Encoding Sheet ${f.month}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
      await load();
    },
  };
})();

'use strict';
(() => {
  const { $, $$, html, render, fmt, api, toast, fail } = VC;
  const RLABEL = { OR: 'OR', AR: 'AR', Receipt: '', Voucher: '', None: '' };

  function printCashflow(d) {
    const st = d.status;
    const cnt = d.counts || {};
    const denomRows = [...d.denoms.filter((x) => cnt[x]), ...(cnt.coins ? ['coins'] : [])];
    const sign = (role, name, label, when) => html`<div><div>${label}</div><div class="line">${name}</div><div>${role}</div>${when ? html`<div class="stamp">${when}</div>` : ''}</div>`;
    VC.printSheet(html`<div class="sheet">
      ${VC.sheetHead('Cashflow')}
      <table>
        <tr><td style="width:16%"><b>Date:</b></td><td colspan="4" class="u">${fmt.long(d.day)}</td></tr>
        <tr><td class="u">A.Cash-In</td><td colspan="4"></td></tr>
        <tr><th>OR# / TR#</th><th>Particulars</th><th>Payor</th><th>Category</th><th class="r">Amount</th></tr>
        <tr><td>—</td><td>${d.begin_label}</td><td>—</td><td>Beginning Balance</td><td class="r"><b>${d.begin}</b></td></tr>
        ${d.cash_in.map((t) => html`<tr><td>${RLABEL[t.receipt] ? RLABEL[t.receipt] + ' ' : ''}${t.ref_no}</td><td>${t.particulars}</td><td>${t.party}</td><td>${t.category}${t.receipt === 'AR' ? ' (AR)' : ''}</td><td class="r">${t.amount}</td></tr>`)}
        <tr><td colspan="4" class="r tot">Total Cash-In</td><td class="r tot dbl">${d.total_cash_in}</td></tr>
        <tr><td colspan="5">&nbsp;</td></tr>
        <tr><td class="u">B.Cash-Out</td><td colspan="4"></td></tr>
        <tr><th>Voucher #</th><th>Particulars</th><th>Payee</th><th>Category</th><th class="r">Amount</th></tr>
        ${d.cash_out.length ? d.cash_out.map((t) => html`<tr><td>${t.ref_no}</td><td>${t.particulars}</td><td>${t.party}</td><td>${t.category}</td><td class="r">${t.amount}</td></tr>`) : html`<tr><td colspan="5" style="color:#555">No cash out.</td></tr>`}
        <tr><td colspan="4" class="r tot">Total Cash-Out</td><td class="r tot dbl">${d.total_out}</td></tr>
      </table>
      <table style="margin-top:14px">
        <tr><td style="width:50%;vertical-align:top">
          <table>
            <tr><td class="u">C. Cash Balance (A − B)</td><td class="r">${d.balance}</td></tr>
            <tr><td class="u">D. Actual Cash Count</td><td class="r">${d.counted ?? '—'}</td></tr>
            <tr><td class="u">E. Cash Over / (Short)</td><td class="r">${d.over_short == null ? '—' : d.over_short_c < 0 ? `(${d.over_short.replace('-', '')})` : d.over_short}</td></tr>
            <tr><td class="u">F. Cash on Hand</td><td class="r tot">${d.on_hand}</td></tr>
            <tr><td colspan="2" style="font-style:italic;font-size:8.5pt">(carried forward as the beginning balance of the next day)</td></tr>
            ${d.explanation ? html`<tr><td colspan="2" style="font-size:8.5pt"><b>Explanation:</b> ${d.explanation}</td></tr>` : ''}
          </table></td>
          <td style="vertical-align:top">
          <table class="boxed">
            <tr><th colspan="3" style="text-align:center">Cash Count</th></tr>
            <tr><th>Denomination</th><th class="r">Pieces</th><th class="r">Amount</th></tr>
            ${denomRows.length ? denomRows.map((x) => x === 'coins'
              ? html`<tr><td>Coins (centavos)</td><td></td><td class="r">${cnt.coins}</td></tr>`
              : html`<tr><td>₱${Number(x).toLocaleString('en-US')}</td><td class="r">${cnt[x]}</td><td class="r">${fmt.cents(cnt[x] * x * 100)}</td></tr>`)
            : html`<tr><td colspan="3">Not counted</td></tr>`}
            <tr><td colspan="2"><b>Total</b></td><td class="r"><b>${d.counted ?? '—'}</b></td></tr>
          </table></td></tr>
      </table>
      <div class="sig">
        ${sign('Cashier', st.submitted_by || d.signers.cashier, 'Prepared by:', st.submitted_at && `Submitted ${fmt.when(st.submitted_at)}`)}
        ${sign('Administrator', st.checked_by || d.signers.admin, 'Checked by:', st.checked_at && `Checked ${fmt.when(st.checked_at)}`)}
        ${sign('President', st.approved_by || d.signers.president, 'Approved by:', st.approved_at && `Approved ${fmt.when(st.approved_at)}`)}
      </div>
      <div class="foot-note"><b>Note: Cash on hand budget for petty cash.</b> Generated automatically from the Encoding Sheet.</div>
    </div>`, { title: `Cashflow ${d.day}` });
  }

  VC.views.cashflow = {
    async render(main, [dayParam]) {
      const meta = VC.state.meta;
      if (!meta.opening) {
        render(main, html`<div class="card pad empty"><b>No cashflow yet</b>Set the starting petty cash in Settings first.</div>`);
        return;
      }
      let day = dayParam || meta.today;
      if (day < meta.opening.first_day) day = meta.opening.first_day;
      if (day > meta.today) day = meta.today;
      let d = await api('GET', `/api/cashflow/${day}`);
      const me = VC.state.me;
      const encoder = VC.can.encode();
      const locked = () => !!(d.status.checked_at || d.status.approved_at);
      const editable = () => encoder && !locked() && d.day <= meta.today;

      render(main, html`
        <div class="page-head">
          <div><h1>Daily Cashflow</h1><p>Generated automatically from the Encoding Sheet.</p></div>
          <div class="actions">
            <div class="date-nav">
              <button id="prev" aria-label="Previous day">‹</button>
              <label class="label"><span id="dlabel"></span><input type="date" id="dpick" min="${meta.opening.first_day}" max="${meta.today}" aria-label="Pick a date"></label>
              <button id="next" aria-label="Next day">›</button>
            </div>
            <button class="btn" id="pdf">Save as PDF</button>
            <button class="btn primary" id="print">Print</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="grid-cf">
          <div class="stack">
            <section class="card cf-sec" id="cin"></section>
            <section class="card cf-sec" id="cout"></section>
            <section id="nocash"></section>
            <section class="card signs" id="signs"></section>
          </div>
          <div class="stack">
            <section class="card count-card" id="count"></section>
            <section class="card dark close-card" id="close"></section>
          </div>
        </div>`);

      function drawHead() {
        $('#dlabel').textContent = fmt.full(d.day);
        $('#dpick').value = d.day;
        $('#prev').disabled = !d.prev;
        $('#next').disabled = !d.next;
        render($('#stats'), html`
          <div class="stat"><small>Beginning balance · from ${fmt.short(VC.addDays(d.day, -1))}</small><div class="v">${d.begin}</div></div>
          <div class="stat"><small>Cash in</small><div class="v in">+${d.total_in}</div></div>
          <div class="stat"><small>Cash out</small><div class="v out">${d.total_out_c ? '-' : ''}${d.total_out}</div></div>
          <div class="stat dark"><small>Cash on hand · carried to ${fmt.short(VC.addDays(d.day, 1))}</small><div class="v">${d.on_hand}</div></div>`);
      }

      function drawTables() {
        render($('#cin'), html`<h2>A. Cash-In</h2>
          <div class="table-wrap"><table class="t">
            <thead><tr><th>OR# / TR#</th><th>Particulars</th><th>Payor</th><th>Category</th><th class="num">Amount</th></tr></thead>
            <tbody>
              <tr class="begin"><td>—</td><td>${d.begin_label}</td><td>—</td><td>Beginning Balance</td><td class="num mono">${d.begin}</td></tr>
              ${d.cash_in.map((t) => html`<tr><td class="mono" style="white-space:nowrap">${RLABEL[t.receipt] ? RLABEL[t.receipt] + ' ' : ''}${t.ref_no}</td><td>${t.particulars}</td><td>${t.party}</td>
                <td>${t.category}${t.receipt === 'AR' ? html` <span class="badge wait" style="font-size:11px">AR · not in report</span>` : ''}${t.type === 'Return' ? html` <span class="badge info" style="font-size:11px">returned advance</span>` : ''}</td><td class="num mono">${t.amount}</td></tr>`)}
            </tbody></table></div>
          <div class="total-row"><span>Total Cash-In</span><span class="mono">${d.total_cash_in}</span></div>`);
        render($('#cout'), html`<h2>B. Cash-Out</h2>
          ${d.cash_out.length ? html`<div class="table-wrap"><table class="t">
            <thead><tr><th>Voucher #</th><th>Particulars</th><th>Payee</th><th>Category</th><th class="num">Amount</th></tr></thead>
            <tbody>${d.cash_out.map((t) => html`<tr><td class="mono" style="white-space:nowrap">${t.ref_no}</td><td>${t.particulars}</td><td>${t.party}</td>
              <td>${t.category}${t.type === 'Cash Advance' ? html` <span class="badge info" style="font-size:11px">not an expense yet</span>` : ''}</td><td class="num mono">${t.amount}</td></tr>`)}</tbody>
          </table></div>` : html`<p class="muted" style="margin:6px 0 4px">No cash went out on this day.</p>`}
          <div class="total-row"><span>Total Cash-Out</span><span class="mono">${d.total_out}</span></div>`);
        render($('#nocash'), d.no_cash.length ? html`<div class="card note-card"><b>Recorded today without cash moving:</b>
          ${d.no_cash.map((t) => html`<div style="margin-top:6px">${t.type} <span class="mono">${t.ref_no}</span> · ${t.particulars} · <span class="mono">${t.amount}</span> <span class="muted">(${t.category}, counted in the Financial Report)</span></div>`)}</div>` : '');
      }

      // --------------------------------------------- cash count (live totals, saved in the background)
      const pieces = {};
      let coins = '';
      let explanation = '';
      function loadCounts() {
        for (const k of d.denoms) pieces[k] = d.counts?.[k] ?? '';
        coins = d.counts?.coins ?? '';
        explanation = d.explanation || '';
      }
      function countedCents() {
        let any = false;
        let t = 0;
        for (const k of d.denoms) { const n = parseInt(pieces[k], 10); if (n > 0) { any = true; t += n * Number(k) * 100; } }
        const c = fmt.toCents(coins);
        if (coins !== '' && Number.isFinite(c)) { any = true; t += c; }
        return any ? t : null;
      }
      function drawCount() {
        const ed = editable();
        render($('#count'), html`<h2>Cash count</h2><p class="sub">Count the cash box at close of day and enter the pieces.${!encoder ? '' : locked() ? ' This day is already checked.' : ''}</p>
          <table class="t count-table" style="margin-top:10px">
            <thead><tr><th>Denomination</th><th style="width:96px">Pieces</th><th class="num">Amount</th></tr></thead>
            <tbody>
              ${d.denoms.map((k) => html`<tr><td class="mono">₱${Number(k).toLocaleString('en-US')}</td>
                <td><input class="input" data-denom="${k}" value="${pieces[k]}" inputmode="numeric" ${ed ? '' : 'disabled'} aria-label="Pieces of ₱${k}"></td>
                <td data-amt="${k}">${fmt.cents((parseInt(pieces[k], 10) || 0) * Number(k) * 100)}</td></tr>`)}
              <tr><td class="mono">Coins (centavos)</td><td><input class="input" data-coins value="${coins}" inputmode="decimal" placeholder="0.00" ${ed ? '' : 'disabled'} aria-label="Coins amount"></td>
                <td data-amt="coins">${fmt.cents(Number.isFinite(fmt.toCents(coins)) ? fmt.toCents(coins) : 0)}</td></tr>
            </tbody>
            <tfoot><tr><td colspan="2">Total counted <span class="saving" id="saving"></span></td><td id="ctotal">${countedCents() == null ? '—' : fmt.cents(countedCents())}</td></tr></tfoot>
          </table>`);
      }
      function drawClose() {
        const counted = countedCents();
        const diff = counted == null ? null : counted - d.balance_c;
        const onHand = counted == null ? d.balance_c : counted;
        const badge = diff == null ? html`<span class="badge pend">Not counted</span>` : diff === 0 ? html`<span class="badge ok">Balanced</span>` : diff > 0 ? html`<span class="badge wait">Over</span>` : html`<span class="badge bad">Short</span>`;
        const ed = editable();
        render($('#close'), html`<h2>Close of day</h2>
          <div class="close-row"><span>C. Cash Balance (A – B)</span><span class="mono">${d.balance}</span></div>
          <div class="close-row"><span>D. Actual Cash Count</span><span class="mono">${counted == null ? '—' : fmt.cents(counted)}</span></div>
          <div class="close-row hl"><span>E. Cash Over / (Short)</span><span style="display:flex;gap:10px;align-items:center">${badge}<span class="mono">${diff == null ? '—' : diff < 0 ? `(${fmt.cents(-diff)})` : fmt.cents(diff)}</span></span></div>
          <label class="f" for="expl" style="color:#d6e1d9;font-weight:400">Explanation if over or short</label>
          <textarea class="input" id="expl" ${ed && diff ? '' : 'disabled'} placeholder="${diff ? 'Required — what caused the difference?' : 'Not needed — balanced'}">${explanation}</textarea>
          <div class="close-row final"><span>F. Cash on Hand</span><span class="mono">${fmt.cents(onHand)}</span></div>
          <p class="muted" style="margin:6px 0 0;font-size:13.5px">Becomes the petty cash of ${fmt.short(VC.addDays(d.day, 1))}.${counted == null ? ' Until the cash is counted, the computed balance is carried forward.' : ''}</p>`);
      }

      let saveTimer = null;
      let saving = Promise.resolve();
      function scheduleSave() {
        clearTimeout(saveTimer);
        $('#saving').textContent = '· saving…';
        saveTimer = setTimeout(() => { saving = saveCount(); }, 700);
      }
      async function saveCount() {
        try {
          const counts = { ...pieces, coins };
          d = await api('PUT', `/api/cashflow/${d.day}/count`, { counts, explanation });
          const el = $('#saving');
          if (el) el.textContent = '· saved';
          drawHead();
          drawSigns();
        } catch (e) {
          const el = $('#saving');
          if (el) el.textContent = '';
          fail(e);
        }
      }
      async function flushSave() {
        if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; saving = saveCount(); }
        await saving;
      }

      $('#count').addEventListener('input', (e) => {
        const t = e.target;
        if (t.dataset.denom) {
          t.value = t.value.replace(/\D/g, '');
          pieces[t.dataset.denom] = t.value;
          $(`[data-amt="${t.dataset.denom}"]`).textContent = fmt.cents((parseInt(t.value, 10) || 0) * Number(t.dataset.denom) * 100);
        } else if ('coins' in t.dataset) {
          coins = t.value;
          const c = fmt.toCents(coins);
          $('[data-amt="coins"]').textContent = fmt.cents(Number.isFinite(c) ? c : 0);
        } else return;
        const c = countedCents();
        $('#ctotal').textContent = c == null ? '—' : fmt.cents(c);
        drawClose();
        scheduleSave();
      });
      $('#close').addEventListener('input', (e) => {
        if (e.target.id !== 'expl') return;
        explanation = e.target.value;
        scheduleSave();
      });

      // --------------------------------------------- sign-offs
      function drawSigns() {
        const st = d.status;
        const isAdmin = me.role === 'admin';
        const isPres = me.role === 'president';
        const col = (label, name, role, badge, when, action) => html`<div><small>${label}</small><b>${name || '—'}</b><div class="role">${role}</div>${badge}${when ? html`<div class="when">${when}</div>` : ''}${action ? html`<div class="act">${action}</div>` : ''}</div>`;
        const prepared = st.submitted_at ? html`<span class="badge ok">Submitted</span>` : html`<span class="badge pend">Not submitted</span>`;
        const checked = st.checked_at ? html`<span class="badge ok">Checked</span>` : st.submitted_at ? html`<span class="badge wait">Awaiting check</span>` : html`<span class="badge pend">Pending</span>`;
        const approved = st.approved_at ? html`<span class="badge ok">Approved</span>` : st.checked_at ? html`<span class="badge wait">Awaiting approval</span>` : html`<span class="badge pend">Pending</span>`;
        render($('#signs'), html`
          ${col('Prepared by', st.submitted_by || d.signers.cashier, 'Cashier', prepared, st.submitted_at && fmt.when(st.submitted_at),
            encoder && !st.submitted_at && !locked() ? html`<button class="btn primary sm" data-step="submit">Submit for checking</button>` : '')}
          ${col('Checked by', st.checked_by || d.signers.admin, 'Administrator', checked, st.checked_at && fmt.when(st.checked_at),
            isAdmin && st.submitted_at && !st.checked_at ? html`<button class="btn primary sm" data-step="check">Mark as checked</button>`
              : isAdmin && st.checked_at ? html`<button class="btn sm" data-step="reopen">Reopen day</button>` : '')}
          ${col('Approved by', st.approved_by || d.signers.president, 'President', approved, st.approved_at && fmt.when(st.approved_at),
            isPres && st.checked_at && !st.approved_at ? html`<button class="btn primary sm" data-step="approve">Approve</button>` : '')}`);
      }
      $('#signs').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-step]');
        if (!b) return;
        const step = b.dataset.step;
        let body = {};
        if (step === 'reopen') {
          const reason = await VC.promptDialog({ title: `Reopen ${fmt.short(d.day)}?`, body: 'All three sign-offs are cleared so the cash count can be corrected.', label: 'Reason', ok: 'Reopen day' });
          if (!reason) return;
          body = { reason };
        }
        if (step === 'submit') await flushSave();
        if (step === 'check' || step === 'approve') {
          const ok = await VC.confirmDialog({ title: step === 'check' ? `Mark ${fmt.short(d.day)} as checked?` : `Approve the ${fmt.short(d.day)} Cashflow?`,
            body: `Cash on hand ${d.on_hand}${d.over_short_c ? ` · ${d.over_short_c > 0 ? 'over' : 'short'} ${fmt.cents(Math.abs(d.over_short_c))}` : ' · balanced'}. Your name and the time are recorded.`,
            ok: step === 'check' ? 'Mark as checked' : 'Approve' });
          if (!ok) return;
        }
        b.disabled = true;
        try {
          d = await api('POST', `/api/cashflow/${d.day}/${step}`, body);
          toast({ submit: 'Submitted for checking', check: 'Marked as checked', approve: 'Approved', reopen: 'Day reopened' }[step]);
          drawAll();
        } catch (err) { fail(err); b.disabled = false; }
      });

      function drawAll() {
        loadCounts();
        drawHead(); drawTables(); drawCount(); drawClose(); drawSigns();
      }

      const go = async (to) => {
        await flushSave();
        location.hash = `#/cashflow/${to}`;
      };
      $('#prev').addEventListener('click', () => d.prev && go(d.prev));
      $('#next').addEventListener('click', () => d.next && go(d.next));
      $('#dpick').addEventListener('change', (e) => e.target.value && go(e.target.value));
      $('#print').addEventListener('click', async () => { await flushSave(); printCashflow(d); });
      $('#pdf').addEventListener('click', async () => {
        await flushSave();
        toast('In the print window, choose “Save as PDF” as the printer.');
        printCashflow(d);
      });

      drawAll();
      return () => { if (saveTimer) { clearTimeout(saveTimer); saveCount(); } };
    },
  };
})();

'use strict';
(() => {
  const { $, html, render, fmt, api, toast } = VC;
  const cell = (c) => (c ? fmt.cents(c) : '–');

  function printReport(r) {
    const inc = r.columns.filter((c) => c.kind === 'income');
    const exp = r.columns.filter((c) => c.kind === 'expense');
    // Group header row: consecutive expense columns with the same group share one heading.
    const groups = [];
    for (const c of exp) {
      const last = groups[groups.length - 1];
      if (c.grp && last && last.grp === c.grp) last.n++;
      else groups.push({ grp: c.grp, n: 1, col: c });
    }
    VC.printSheet(html`<div class="sheet rep">
      ${VC.sheetHead(`Financial Report ${r.year}`)}
      <table>
        <thead>
          <tr><th rowspan="3">Months</th><th colspan="${inc.length + 1}">INCOME</th><th colspan="${exp.length}">Expenses ${r.year}</th><th colspan="2">Summary</th></tr>
          <tr>${inc.map((c) => html`<th rowspan="2">${c.name}</th>`)}<th rowspan="2">Total Income</th>
            ${groups.map((g) => (g.grp ? html`<th colspan="${g.n}">${g.grp}</th>` : html`<th rowspan="2">${g.col.name}</th>`))}
            <th rowspan="2">Total Expenses</th><th rowspan="2">Net Income</th></tr>
          <tr>${exp.filter((c) => c.grp).map((c) => html`<th>${c.name}</th>`)}</tr>
        </thead>
        <tbody>${r.months.map((m) => html`<tr><td>${m.month}</td>${inc.map((c) => html`<td>${m.values[c.id] ? fmt.cents(m.values[c.id]) : ''}</td>`)}

                <th class="band-expense" colspan="${exp.length}" style="text-align:left"><span>Expenses ${r.year}</span></th>
                <th class="band-summary" colspan="2">Summary</th></tr>

              <td class="col-sum divider ${m.expense_c ? '' : 'zero'}">${cell(m.expense_c)}</td>
              <td class="col-sum ${m.has ? (m.net_c < 0 ? 'neg' : '') : 'zero'}">${m.has ? fmt.cents(m.net_c) : '–'}</td>
            </tr>`)}</tbody>
            <tfoot><tr><td class="stick">TOTAL</td>${inc.map((c) => html`<td>${fmt.cents(r.totals[c.id])}</td>`)}<td>${fmt.cents(r.income_c)}</td>
              ${exp.map((c, i) => html`<td class="${i === 0 ? 'divider' : ''}">${fmt.cents(r.totals[c.id])}</td>`)}
              <td class="divider">${fmt.cents(r.expense_c)}</td><td class="${r.net_c < 0 ? 'neg' : ''}">${fmt.cents(r.net_c)}</td></tr></tfoot>

          <div><small>Checked by</small><b>${r.signers.admin}</b><div class="role">Administrator</div></div>
          <div><small>Approved by</small><b>${r.signers.president}</b><div class="role">President</div></div>
        </section>`);

      $('#year').addEventListener('change', (e) => { location.hash = `#/report/${e.target.value}`; });
      $('#print').addEventListener('click', () => printReport(r));

'use strict';
(() => {
  const { html, render, fmt, api } = VC;
  const pct = (part, whole) => (whole ? Math.max(0, Math.min(100, (part / whole) * 100)) : 0);

  function bar(a) {
    return html`<div class="bar" aria-label="Liquidated ${a.liquidated}, returned ${a.returned} of ${a.released}">
      <i class="liq" style="width:${pct(a.liquidated_c, a.released_c)}%"></i><i class="ret" style="width:${pct(a.returned_c, a.released_c)}%"></i></div>`;
  }

  const STEP = {
    'Cash Advance': (t) => [`Cash Advance released`, `${fmt.short(t.txn_date)} · ${t.receipt === 'Voucher' ? 'Voucher' : t.receipt} · deducted from cash on hand, not an expense`],
    Liquidation: (t) => [`Liquidation · ${t.category}`, `${fmt.short(t.txn_date)} · ${t.receipt === 'None' ? 'no receipt' : t.receipt === 'Receipt' ? 'receipt' : t.receipt} from ${t.party || '—'} · counted in the Financial Report`],
    Return: (t) => ['Return of unspent cash', `${fmt.short(t.txn_date)} · added back to cash on hand`],
  };

  VC.views.advances = {
    narrow: true,
    async render(main) {
      const r = await api('GET', '/api/advances');
      const s = r.stats;
      const enc = VC.can.encode();
      render(main, html`
        <div class="page-head"><div><h1>Cash Advances</h1><p>Money released before the expense is known. Each advance stays here until it is fully liquidated or returned.</p></div>
          ${enc ? html`<div class="actions"><a class="btn" href="#/encode?type=Cash%20Advance">+ Release a cash advance</a></div>` : ''}</div>
        <div class="stats three">
          <div class="stat dark"><small>Still outstanding</small><div class="v gold">${s.outstanding}</div><div class="foot">${s.outstanding_count} advance${s.outstanding_count === 1 ? '' : 's'}</div></div>
          <div class="stat"><small>Released this month</small><div class="v">${s.released_month}</div></div>
          <div class="stat"><small>Settled this month</small><div class="v in">${s.settled_month}</div></div>
        </div>
        <h2 class="section-title">Outstanding</h2>
        ${r.outstanding.length ? r.outstanding.map((a) => html`
          <section class="card adv">
            <div class="adv-head"><div><div class="mono">${a.ref}</div><h3>${a.particulars}</h3>
              <div class="muted">Released ${fmt.short(a.released_on)} to ${a.party || '—'} · waiting ${a.waiting_days} day${a.waiting_days === 1 ? '' : 's'}</div></div>
              <div>${a.liquidated_c || a.returned_c ? html`<span class="badge wait">Partly liquidated</span>` : html`<span class="badge wait">Not yet liquidated</span>`}
                ${a.waiting_days > 14 ? html` <span class="badge bad">Overdue</span>` : ''}</div></div>
            ${bar(a)}
            <div class="adv-nums">
              <div><small>Released</small><span class="mono">${a.released}</span></div>
              <div><small>Liquidated</small><span class="mono">${a.liquidated}</span></div>
              <div><small>Returned</small><span class="mono">${a.returned}</span></div>
              <div><small>Balance</small><span class="mono out">${a.balance}</span></div>
            </div>
            ${a.timeline.length > 1 ? html`<div class="timeline" style="margin-top:18px">${a.timeline.slice(1).map(step)}</div>` : ''}
            ${enc ? html`<div class="adv-actions">
              <a class="btn primary" href="#/encode?type=Liquidation&ref=${encodeURIComponent(a.ref)}">Record liquidation</a>
              <a class="btn" href="#/encode?type=Return&ref=${encodeURIComponent(a.ref)}">Record return</a></div>` : ''}
          </section>`) : html`<section class="card empty"><b>Nothing outstanding</b>Every cash advance has been liquidated or returned.</section>`}
        <h2 class="section-title">Settled</h2>
        ${r.settled.length ? r.settled.map((a) => html`
          <section class="card settled">
            <div><div class="mono muted">${a.ref}</div><h3>${a.particulars}</h3>
              <div class="muted" style="margin-bottom:4px">${a.party || '—'} · settled ${fmt.short(a.settled_on)}</div>
              ${bar(a)}
              ${a.balance_c < 0 ? html`<span class="badge wait">Over-liquidated by ${fmt.cents(-a.balance_c)}</span>` : html`<span class="badge ok">Fully settled · balance 0.00</span>`}</div>
            <div class="timeline">${a.timeline.map(step)}</div>
          </section>`) : html`<section class="card empty"><b>None yet</b>Advances appear here once fully liquidated or returned.</section>`}`);

      function step(t) {
        const [title, sub] = (STEP[t.type] || ((x) => [x.type, fmt.short(x.txn_date)]))(t);
        return html`<div class="tl ${t.type}"><div><b>${title}</b><small>${sub}</small></div><span class="mono">${t.amount}</span></div>`;
      }
    },
  };
})();

'use strict';
(() => {
  const { $, html, render, fmt, api, toast, fail } = VC;
  const FILTERS = [['', 'Everything'], ['encode', 'Encoded'], ['edit', 'Changed'], ['void', 'Removed'], ['signoff', 'Sign-offs'], ['backup', 'Backups'], ['user', 'Users']];

  function row(r) {
    const name = r.user_id ? r.short_name : 'System';
    const cls = r.user_id ? '' : 'sys';
    const roleCls = r.user_id ? (VC.state.roles?.[r.user_id] ? `r-${VC.state.roles[r.user_id]}` : '') : '';
    return html`<div class="log-row">
      <span class="avatar ${cls} ${roleCls}">${r.user_id ? fmt.initials(r.full_name) : 'SY'}</span>
      <div><div class="t"><b>${name}</b> ${r.text}${r.ref && r.action !== 'system' ? html` <span class="mono">${r.ref}</span>` : ''}</div>
        ${r.detail ? html`<div class="d">${r.detail}</div>` : ''}
        <div class="w">${fmt.when(r.at)}</div></div></div>`;
  }

  VC.views.log = {
    narrow: true,
    async render(main) {
      const ctl = await api('GET', '/api/controls');
      VC.state.roles = Object.fromEntries(ctl.users.map((u) => [u.id, u.role]));
      const role = VC.state.me.role;
      const canCheck = role === 'admin' || role === 'president';
      const lc = ctl.last_check;
      let action = '';
      let rows = [];

      render(main, html`
        <div class="grid-2">
          <div>
            <div class="page-head" style="margin-bottom:16px"><div><h1>Change Log</h1><p>Every entry records when it was encoded. Any later change is kept with the name of the person who made it.</p></div></div>
            <div class="chips" id="lf" style="margin-bottom:14px">${FILTERS.map(([k, l]) => html`<button class="chip sm ${k === '' ? 'on' : ''}" data-f="${k}">${l}</button>`)}</div>
            <section class="card" style="padding:4px 22px"><div id="rows"></div></section>
            <div style="text-align:center;margin-top:14px"><button class="btn hidden" id="more">Show older</button></div>
          </div>
          <aside class="stack" style="padding-top:4px">
            <section class="card dark pad" style="padding:22px">
              <h2 style="margin-bottom:14px">Controls in place</h2>
              <div class="inset ctl"><b>Sign-in required</b><span>Only authorized staff can encode or view.</span></div>
              <div class="inset ctl"><b>Numbered vouchers</b><span>PCV and CA numbers run in sequence — none skipped or reused.</span></div>
              <div class="inset ctl"><b>Three signatures</b><span>Prepared by Cashier, checked by Administrator, approved by President.</span></div>
              <div class="inset ctl" style="margin-bottom:0"><b>Weekly cash count</b>
                <span>Done by someone other than the cashier. ${lc ? `Last: ${fmt.dayShort(lc.check_date)} by ${lc.full_name.split(' ')[0]} · ${lc.diff === '0.00' ? 'balanced' : (lc.diff.startsWith('-') ? 'short ' + lc.diff.slice(1) : 'over ' + lc.diff)}.` : 'Not done yet.'}</span>
                ${canCheck ? html`<button class="btn sm" id="count">Record a cash count</button>` : ''}</div>
            </section>
            <section class="card pad" style="padding:22px 22px 8px">
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><h2 style="font-size:17px">Users</h2>${VC.can.admin() ? html`<a class="link-btn" href="#/settings">Manage</a>` : ''}</div>
              ${ctl.users.map((u) => html`<div class="user-row"><b style="font-weight:400">${u.full_name}</b><span>${u.role_label}</span></div>`)}
            </section>
          </aside>
        </div>`);

      async function load(append) {
        const before = append && rows.length ? rows[rows.length - 1].id : '';
        const r = await api('GET', `/api/log?before=${before}&action=${action}`);
        rows = append ? rows.concat(r.rows) : r.rows;
        render($('#rows'), rows.length ? rows.map(row) : html`<div class="empty">Nothing recorded yet.</div>`);
        $('#more').classList.toggle('hidden', r.rows.length < 60);
      }
      $('#lf').addEventListener('click', (e) => {
        const b = e.target.closest('[data-f]');
        if (!b) return;
        action = b.dataset.f;
        document.querySelectorAll('#lf .chip').forEach((x) => x.classList.toggle('on', x === b));
        load(false);
      });
      $('#more').addEventListener('click', () => load(true));
      $('#count')?.addEventListener('click', () => {
        VC.modal(html`<h2>Weekly cash count</h2><p>Count the petty cash box yourself, then enter the total. The system compares it with the cash on hand on record for today.</p>
          <form><label class="f">Total cash counted</label><input class="input num" name="counted" inputmode="decimal" placeholder="0.00" autocomplete="off"><div class="err" data-for="counted"></div>
          <label class="f" style="margin-top:12px">Note (optional)</label><input class="input" name="note" placeholder="e.g. counted with the cashier present" autocomplete="off">
          <div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Record count</button></div></form>`,
        (el, close) => {
          const f = el.querySelector('form');
          f.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
              const r = await api('POST', '/api/cash-checks', { counted: f.counted.value, note: f.note.value });
              close(true);
              toast(r.diff_c === 0 ? `Balanced: ${r.counted} matches the record` : `${r.diff_c > 0 ? 'Over' : 'Short'} by ${fmt.cents(Math.abs(r.diff_c))} (record says ${r.expected})`, r.diff_c !== 0);
              VC.route();
            } catch (err) { VC.showFieldErrors(f, err.data?.fields); if (!err.data?.fields) fail(err); }
          });
        });
      });
      await load(false);
    },
  };
})();

'use strict';
(() => {
  const { $, html, raw, render, fmt, api, toast, fail, icon } = VC;
  const size = (b) => (b > 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`);

  VC.views.backup = {
    narrow: true,
    async render(main) {
      const enc = VC.can.encode();
      let b = await api('GET', '/api/backup');

      function draw() {
        const last = b.last;
        const today = VC.state.meta.today;
        const okToday = last && last.at.startsWith(today);
        const [hh, mm] = b.time.split(':').map(Number);
        const timeLabel = fmt.time(`2000-01-01T${b.time}`);
        const nowPast = new Date().getHours() * 60 + new Date().getMinutes() >= hh * 60 + mm;
        const usb = b.destinations.usb;
        const gd = b.destinations.gdrive;
        render(main, html`
          <div class="page-head"><div><h1>Backup &amp; Restore</h1><p>Records live on this computer. A copy is saved every day so nothing is lost if the computer fails.</p></div>
            <div class="actions"><button class="btn primary" id="now">Back up now</button></div></div>
          <div class="grid-2" style="grid-template-columns:minmax(0,1fr) minmax(0,.66fr)">
            <div>
              <section class="card dark ok-card ${okToday ? '' : 'warn'}">
                <div class="check">${raw(okToday ? icon.check : icon.alert)}</div>
                <div><b>${okToday ? `Backed up today at ${fmt.time(last.at)}` : last ? `Last backup: ${fmt.dayShort(last.at)} at ${fmt.time(last.at)}` : 'Not backed up yet'}</b>
                <span>Automatic daily backup is on · next at ${timeLabel} ${okToday || nowPast ? 'tomorrow' : 'today'}${!okToday && nowPast ? ' (or as soon as the program is open)' : ''}</span></div>
              </section>
              <section class="card pad">
                <h2>Where copies are saved</h2>
                <div class="dest ${usb.connected ? 'on' : ''}">
                  <div><b>USB flash drive${usb.connected ? ` · ${usb.label || 'drive'} (${usb.drive})` : ''}</b>
                    <small>Required · keep the drive in a safe place · ${usb.path || 'no folder set'}</small></div>
                  <div class="right">${usb.connected ? html`<span class="badge ok">Connected</span>` : html`<span class="badge bad">Not plugged in</span>`}
                    ${enc ? html`<button class="btn sm" id="usb">Change</button>` : ''}</div>
                </div>
                <div class="dest">
                  <div><b>Google Drive folder (free tier)</b><small>Optional extra copy · uploads when the internet is available${gd.path ? ` · ${gd.path}` : ''}</small>
                    ${gd.enabled && !gd.ready ? html`<small style="color:var(--danger)">Folder not found. Is Google Drive for desktop installed and signed in?</small>` : ''}</div>
                  <div class="right">${enc ? html`<button class="btn sm" id="gdpath">${gd.path ? 'Change' : 'Choose folder'}</button>` : ''}
                    <label class="toggle"><input type="checkbox" id="gd" ${gd.enabled ? 'checked' : ''} ${enc ? '' : 'disabled'}> On</label></div>
                </div>
                <div class="dest">
                  <div><b>Local network sharing</b><small>Lets the Administrator and President view reports from their computers, no internet needed</small>
                    ${b.lan.enabled && b.lan.addresses.length ? html`<small>On their computer, open: <b class="mono">${b.lan.addresses.join('  or  ')}</b></small>` : ''}</div>
                  <div class="right"><label class="toggle"><input type="checkbox" id="lan" ${b.lan.enabled ? 'checked' : ''} ${enc ? '' : 'disabled'}> On</label></div>
                </div>
                ${enc ? html`<div class="dest"><div><b>Daily backup time</b><small>The program must be running at this time. It also catches up when it next opens.</small></div>
                  <div class="right"><input class="input" type="time" id="time" value="${b.time}" style="width:140px"></div></div>` : ''}
                <p class="hint" style="margin-top:14px">Records file on this computer: <span class="mono">${b.destinations.local.path.replace(/\\backups$/, '')}</span></p>
              </section>
            </div>
            <section class="card pad" style="padding:22px 22px 18px">
              <h2 style="margin-bottom:10px">Recent backups</h2>
              ${b.list.length ? b.list.slice(0, 12).map((x) => html`<div class="bk-row">
                <div><b>${x.at.startsWith(today) ? 'Today' : fmt.dayShort(x.at).split(',')[0]} · ${fmt.short(x.at)}, ${fmt.time(x.at)}</b>
                  <small>${x.error ? html`<span style="color:var(--danger)">Failed: ${x.error}</span>` : `${x.destinations.replace('This computer + ', '').replace('This computer', 'This computer only')} · ${size(x.size)}${x.kind === 'pre-restore' ? ' · safety copy' : x.kind === 'auto' ? '' : ' · manual'}`}</small></div>
                <div class="btns">${x.exists && !x.error ? html`<a class="btn sm ghost" href="/api/backup/${x.id}/download" title="Save a copy of this backup file">Save copy</a>${enc ? html`<button class="btn sm" data-restore="${x.id}" data-at="${x.at}">Restore</button>` : ''}` : ''}</div>
              </div>`) : html`<p class="muted">No backups yet. Press “Back up now”.</p>`}
              <p class="hint" style="margin-top:12px">Restoring replaces the current records with that copy. You'll be asked to confirm first, and a safety copy of the current records is saved before anything changes.</p>
              ${enc ? html`<button class="btn sm" id="upload" style="margin-top:10px">Restore from a file…</button><input type="file" id="file" accept=".db" class="hidden">` : ''}
            </section>
          </div>`);
        wire();
      }

      async function reload() { b = await api('GET', '/api/backup'); draw(); VC.refreshStatus(); }
      async function save(patch, msg) {
        try { await api('PUT', '/api/backup/settings', patch); if (msg) toast(msg); await reload(); } catch (e) { fail(e); await reload(); }
      }

      function wire() {
        $('#now').addEventListener('click', async (e) => {
          e.target.disabled = true;
          try {
            const r = await api('POST', '/api/backup/run');
            toast(`Backed up to ${r.destinations.join(', ')}`);
            if (r.problems.length) setTimeout(() => toast(r.problems.join(' · '), true), 400);
            await reload();
          } catch (err) { fail(err); e.target.disabled = false; }
        });
        $('#lan')?.addEventListener('change', (e) => save({ lan_enabled: e.target.checked }, e.target.checked ? 'Local network sharing is on' : 'Local network sharing is off'));
        $('#gd')?.addEventListener('change', async (e) => {
          if (e.target.checked && !b.destinations.gdrive.path) {
            const p = await askGdrive();
            if (!p) { e.target.checked = false; return; }
            return save({ backup_gdrive_enabled: true, backup_gdrive_path: p }, 'Google Drive copy is on');
          }
          save({ backup_gdrive_enabled: e.target.checked });
        });
        $('#gdpath')?.addEventListener('click', async () => {
          const p = await askGdrive();

/** Local timestamp, YYYY-MM-DDTHH:MM:SS. */
function nowStr(d = new Date()) {
  return `${todayStr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function addDays(day, n) {
  const [y, m, d] = day.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

function isDate(s) {
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && addDays(s, 0) === s;
}

/** Whole days from a to b (b - a). */
function dayDiff(a, b) {
  return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
}

function monthEnd(month) {
  const [y, m] = month.split('-').map(Number);
  return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
}

/** Parse "1,234.50", 1234.5 or "₱ 1234" into integer centavos. NaN if invalid. */
function toCents(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v * 100) : NaN;
  if (typeof v !== 'string') return NaN;
  const s = v.replace(/[,\s₱]/g, '');
  if (!/^-?\d+(\.\d{0,2})?$/.test(s)) return NaN;
  const neg = s.startsWith('-');
  const [i, f = ''] = s.replace('-', '').split('.');
  const c = parseInt(i, 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  return neg ? -c : c;
}

function fmtCents(c) {
  const neg = c < 0;
  const a = Math.abs(c);
  const whole = Math.floor(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg ? '-' : '') + whole + '.' + pad(a % 100);
}

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map((m) => m.slice(0, 3));

/** "Dec 01" */
function shortDay(day) {
  const [, m, d] = day.split('-');
  return `${MON[+m - 1]} ${d}`;
}

/** "November 30, 2025" */
function longDay(day) {
  const [y, m, d] = day.split('-');
  return `${MONTHS[+m - 1]} ${d}, ${y}`;
}

class HttpError extends Error {
  constructor(status, message, extra) {
    super(message);
    this.status = status;
    this.extra = extra;
  }
}

function hashPassword(pw) {
  const salt = crypto.randomBytes(16);
  const h = crypto.scryptSync(pw, salt, 32);
  return `scrypt$${salt.toString('hex')}$${h.toString('hex')}`;
}

function verifyPassword(pw, stored) {
  if (!stored) return false;
  const [, s, h] = stored.split('$');
  const got = crypto.scryptSync(String(pw), Buffer.from(s, 'hex'), 32);
  const want = Buffer.from(h, 'hex');
  return got.length === want.length && crypto.timingSafeEqual(got, want);
}

function tempPassword() {
  const words = ['mango', 'river', 'cedar', 'pearl', 'eagle', 'tiger', 'lotus', 'amber', 'coral', 'maple'];
  return words[crypto.randomInt(words.length)] + '-' + crypto.randomInt(1000, 9999);
}

const RECEIPTS = ['OR', 'AR', 'Receipt', 'Voucher', 'None'];
const CASH_IN = ['Income', 'Return', 'Replenishment'];
const CASH_OUT = ['Expense', 'Cash Advance'];
// Which category kind each transaction type must use.
const TYPE_KIND = {

  'Cash Advance': 'advance', Return: 'advance', Replenishment: 'other',
};
const DENOMS = ['1000', '500', '200', '100', '50', '20', '10', '5', '1'];

const SQL_IN = CASH_IN.map((t) => `'${t}'`).join(',');
const SQL_OUT = CASH_OUT.map((t) => `'${t}'`).join(',');
const SQL_IN_REPORT = `((t.type = 'Income' AND t.receipt = 'OR') OR t.type IN ('Expense','Liquidation'))`;

function inReport(t) {
  return (t.type === 'Income' && t.receipt === 'OR') || t.type === 'Expense' || t.type === 'Liquidation';
}

function reportLabel(t) {
  if (inReport(t)) return 'Yes';
  if (t.type === 'Income' && t.receipt === 'AR') return 'No (AR)';
  return 'No';
}

/** Signed effect on cash on hand. Liquidations move no cash: the money already left as an advance. */
function cashEffect(t) {
  if (CASH_IN.includes(t.type)) return t.amount_c;
  if (CASH_OUT.includes(t.type)) return -t.amount_c;
  return 0;
}

function opening(store) {
  const date = store.setting('opening_date');
  const bal = store.setting('opening_balance_c');
  if (!isDate(date) || bal === '' || bal == null) return null;
  return { date, balance_c: Number(bal) };
}

function requireOpening(store) {
  const o = opening(store);
  if (!o) throw new HttpError(409, 'Set the starting petty cash balance first (Settings).', { needsOpening: true });
  return o;
}

/**
 * Walks every day that has cash activity or a cash count, carrying the cash on hand forward.
 * A day's closing cash on hand is the actual count when one was entered, otherwise the computed balance.
 */
function buildLedger(store, until = '9999-12-31') {
  const open = opening(store);
  if (!open) return null;
  const ev = new Map();
  const rows = store.all(`
    SELECT txn_date AS d,
      SUM(CASE WHEN type IN (${SQL_IN}) THEN amount_c ELSE 0 END) AS cin,
      SUM(CASE WHEN type IN (${SQL_OUT}) THEN amount_c ELSE 0 END) AS cout
    FROM transactions WHERE voided = 0 AND txn_date > ? AND txn_date <= ?
    GROUP BY txn_date`, open.date, until);
  for (const r of rows) ev.set(r.d, { cin: r.cin, cout: r.cout, counted: null });
  const counts = store.all('SELECT day, counted_total_c FROM day_close WHERE counted_total_c IS NOT NULL AND day > ? AND day <= ?', open.date, until);
  for (const r of counts) {
    const e = ev.get(r.day) || { cin: 0, cout: 0 };
    e.counted = r.counted_total_c;
    ev.set(r.day, e);
  }
  const days = [];
  let bal = open.balance_c;
  for (const d of [...ev.keys()].sort()) {
    const e = ev.get(d);
    const begin = bal;
    const computed = begin + e.cin - e.cout;
    const close = e.counted != null ? e.counted : computed;
    days.push({ day: d, begin, cin: e.cin, cout: e.cout, computed, counted: e.counted, close });
    bal = close;
  }
  return {
    open,
    days,
    /** Cash on hand at the close of `day`. */
    closeOf(day) {
      let c = open.balance_c;
      for (const x of days) {
        if (x.day > day) break;
        c = x.close;
      }
      return c;
    },
    lastDay() { return days.length ? days[days.length - 1].day : open.date; },
  };
}

function categoryMap(store) {
  const m = new Map();
  for (const c of store.all('SELECT * FROM categories ORDER BY sort')) m.set(c.id, c);
  return m;
}

function userNames(store) {
  const m = new Map();
  for (const u of store.all('SELECT id, full_name, short_name, role FROM users')) m.set(u.id, u);
  return m;
}

function shapeTxn(t, cats) {
  const cat = cats.get(t.category_id);
  const encodedDay = t.encoded_at.slice(0, 10);
  return {
    id: t.id,
    txn_date: t.txn_date,
    type: t.type,
    receipt: t.receipt,
    ref_no: t.ref_no,
    particulars: t.particulars,
    party: t.party,
    category_id: t.category_id,
    category: cat ? cat.name : '?',
    amount: fmtCents(t.amount_c),
    amount_c: t.amount_c,
    cash_c: cashEffect(t),
    in_report: reportLabel(t),
    encoded_at: t.encoded_at,
    encoded_on: encodedDay,
    late: encodedDay > t.txn_date,
    updated_at: t.updated_at,
    voided: !!t.voided,
    void_reason: t.void_reason,
  };
}

// ---------------------------------------------------------------- numbering

function voucherPrefix(type) {
  if (type === 'Expense') return 'PCV-';
  if (type === 'Cash Advance') return 'CA-';
  return null;
}

function maxVoucher(store, type, excludeId = 0) {
  const prefix = voucherPrefix(type);
  let max = 0;
  for (const r of store.all('SELECT ref_no FROM transactions WHERE type = ? AND voided = 0 AND id != ? AND ref_no LIKE ?', type, excludeId, prefix + '%')) {
    const m = r.ref_no.slice(prefix.length).match(/^(\d+)$/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return max;
}

function nextRef(store, type) {
  const prefix = voucherPrefix(type);
  if (!prefix) return '';
  return prefix + String(maxVoucher(store, type) + 1).padStart(4, '0');
}

// ---------------------------------------------------------------- advances

function advanceStatus(store, ref, excludeId = 0) {
  const ca = store.get(`SELECT * FROM transactions WHERE type = 'Cash Advance' AND voided = 0 AND ref_no = ? ORDER BY txn_date LIMIT 1`, ref);
  if (!ca) return null;
  const sums = store.get(`
    SELECT
      COALESCE(SUM(CASE WHEN type = 'Cash Advance' THEN amount_c END), 0) AS released,
      COALESCE(SUM(CASE WHEN type = 'Liquidation' THEN amount_c END), 0) AS liquidated,
      COALESCE(SUM(CASE WHEN type = 'Return' THEN amount_c END), 0) AS returned
    FROM transactions WHERE voided = 0 AND ref_no = ? AND id != ?`, ref, excludeId);
  return { ca, ...sums, balance: sums.released - sums.liquidated - sums.returned };
}

function listAdvances(store) {
  const cats = categoryMap(store);
  const rows = store.all(`
    SELECT t.* FROM transactions t
    WHERE t.voided = 0 AND t.ref_no IN (SELECT ref_no FROM transactions WHERE type = 'Cash Advance' AND voided = 0)
    ORDER BY t.txn_date, t.id`);
  const groups = new Map();
  for (const t of rows) {
    if (!groups.has(t.ref_no)) groups.set(t.ref_no, []);
    groups.get(t.ref_no).push(t);

  const settled = [];

  let settledMonth = 0;
  for (const [ref, items] of groups) {
    const ca = items.find((t) => t.type === 'Cash Advance');

      if (t.type === 'Liquidation') liquidated += t.amount_c;

      particulars: ca.particulars,
      party: ca.party,

      liquidated: fmtCents(liquidated), liquidated_c: liquidated,
      returned: fmtCents(returned), returned_c: returned,

// ---------------------------------------------------------------- validation

/**
 * Validates and normalises an entry. Returns { row, warnings }.
 * Hard problems throw 400; warnings need the user to confirm before saving.
 */
function validateTxn(store, body, existingId = 0) {
  const open = requireOpening(store);
  const errors = {};
  const warnings = [];
  const today = todayStr();

  const type = String(body.type || '');
  if (!TYPES.includes(type)) errors.type = 'Choose what happened.';
  const receipt = String(body.receipt || '');

  else if (particulars.length > 200) errors.particulars = 'Keep it under 200 characters.';

      const c = store.get('SELECT id FROM categories WHERE kind = ? AND active = 1 ORDER BY sort LIMIT 1', kind);
      category_id = c ? c.id : 0;
    } else {
      const c = store.get('SELECT * FROM categories WHERE id = ?', category_id);
      if (!c || c.kind !== kind) errors.category_id = `Choose ${kind === 'income' ? 'an income' : 'an expense'} category.`;
    }

  if (!Object.keys(errors).length) {
    // Numbered vouchers run in sequence: no reuse, warn on skipped numbers.
    const prefix = voucherPrefix(type);
    if (prefix && ref_no.startsWith(prefix)) {
      const dup = store.get('SELECT id FROM transactions WHERE type = ? AND ref_no = ? AND voided = 0 AND id != ?', type, ref_no, existingId);
      if (dup) errors.ref_no = `${ref_no} is already used. Voucher numbers cannot be reused.`;

      if (n && !dup) {
        const max = maxVoucher(store, type, existingId);
        const num = parseInt(n[1], 10);

      }
    }
    if (type === 'Income' && (receipt === 'OR' || receipt === 'AR')) {
      const dup = store.get(`SELECT id FROM transactions WHERE type = 'Income' AND receipt = ? AND ref_no = ? AND voided = 0 AND id != ?`, receipt, ref_no, existingId);
      if (dup) errors.ref_no = `${receipt} ${ref_no} is already encoded.`;
    }
    if (type === 'Cash Advance' && !ref_no.startsWith('CA-')) {
      const dup = store.get(`SELECT id FROM transactions WHERE type = 'Cash Advance' AND ref_no = ? AND voided = 0 AND id != ?`, ref_no, existingId);
      if (dup) errors.ref_no = `${ref_no} is already used by another cash advance.`;
