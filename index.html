:root {
  --bg: #f9f6f1;
  --surface: #ffffff;
  --sunk: #f3eee6;
  --tint: #f6f2ec;
  --line: #ebe5dc;
  --line-strong: #ddd5c9;
  --ink: #1d1c1a;
  --ink-2: #4a4741;
  --muted: #74706a;
  --faint: #a29d95;
  --green: #1f6b45;
  --green-hover: #195a3a;
  --green-ink: #1e7a4a;
  --green-soft: #e8f2ec;
  --forest: #213a2e;
  --forest-2: #2a4639;
  --forest-line: #36513f;
  --forest-ink: #d9e5dd;
  --gold: #f2c08a;
  --rust: #b5531f;
  --rust-soft: #fce8dc;
  --amber: #8a5a00;
  --amber-soft: #fcefcf;
  --blue: #2f5ba8;
  --blue-soft: #e4ecfa;
  --violet: #5b4a9c;
  --violet-soft: #ece8f7;
  --danger: #b3261e;
  --danger-soft: #fbe9e7;
  --radius: 18px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(40, 30, 10, .04);
  --shadow-pop: 0 18px 50px rgba(30, 25, 15, .18), 0 2px 6px rgba(30, 25, 15, .08);
  --sans: 'DM Sans', system-ui, 'Segoe UI', sans-serif;
  --mono: 'DM Mono', ui-monospace, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--green); }
h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
.mono, .num { font-family: var(--mono); font-feature-settings: 'zero' 1; }
.num { text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.in { color: var(--green-ink); }
.out { color: var(--rust); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

/* ------------------------------------------------------------------ header */
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 24px; padding: 14px 40px;
  background: rgba(249, 246, 241, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex-shrink: 0; }
.brand img { width: 50px; height: 50px; object-fit: contain; }
.brand b { display: block; font-size: 17px; letter-spacing: -.01em; line-height: 1.15; }
.brand small { display: block; color: var(--muted); font-size: 12.5px; }
.tabs { display: flex; gap: 2px; padding: 4px; border-radius: 22px; background: #efe9e0; }
.tabs a { padding: 9px 16px; border-radius: 18px; color: var(--ink-2); text-decoration: none; font-size: 15px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .07); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-right: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3aa66a; flex-shrink: 0; }
.dot.warn { background: #d99a1c; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); text-decoration: none; }
.icon-btn:hover { border-color: var(--line-strong); color: var(--ink); }
.icon-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
.icon-btn svg { width: 19px; height: 19px; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 14px 4px 4px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); cursor: pointer; position: relative; }
.user-chip b { display: block; white-space: nowrap; font-size: 13.5px; line-height: 1.1; font-weight: 600; text-align: left; }
.user-chip small { display: block; font-size: 12px; color: var(--muted); text-align: left; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-pop); z-index: 40; }
.menu a, .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: 0; background: none; border-radius: 9px; color: var(--ink); text-decoration: none; cursor: pointer; font-size: 14px; }
.menu a:hover, .menu button:hover { background: var(--tint); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

.banner { margin: 18px auto 0; max-width: 1320px; padding: 0 40px; }
.banner > div { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 14px; background: var(--amber-soft); color: #5e4100; font-size: 14px; }
.banner a { margin-left: auto; font-weight: 600; color: #5e4100; }

/* ------------------------------------------------------------------ page */
main { padding: 32px 40px 60px; max-width: 1320px; margin: 0 auto; }
main.narrow { max-width: 1240px; }
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.page-head h1 { font-size: 30px; font-weight: 700; }
.page-head p { margin: 6px 0 0; color: var(--muted); }
.page-head .actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.section-title { font-size: 19px; font-weight: 700; margin: 30px 0 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card.pad { padding: 26px 28px; }
.card h2 { font-size: 19px; font-weight: 700; }
.card .sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.dark { background: var(--forest); color: #fff; border-color: var(--forest); }
.dark .sub, .dark .muted { color: #b9cabf; }
.inset { background: var(--forest-2); border-radius: 14px; padding: 14px 16px; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 444px; gap: 24px; align-items: start; }
.grid-cf { display: grid; grid-template-columns: minmax(0, 1fr) 496px; gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 18px 18px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.stat small { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
.stat .v { font: 500 23px/1.25 var(--mono); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .foot { font-size: 12px; color: var(--muted); margin-top: 4px; }
.stat.dark { background: var(--forest); border-color: var(--forest); }
.stat.dark small { color: #c7d6cc; }
.stat.dark .v { color: #fff; }
.stat.dark .v.gold { color: var(--gold); }
.stat.dark .foot { color: #c7d6cc; }
.stat.note { background: #f1ebe2; border-color: #f1ebe2; font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.stat.note b { color: var(--ink); }

/* ------------------------------------------------------------------ controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 15px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: #c9c0b2; }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 700; }
.btn.primary:hover { background: var(--green-hover); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 38px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.big { height: 50px; padding: 0 26px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; cursor: pointer; font-size: 13.5px; font-weight: 600; }

label.f { display: block; font-size: 14px; font-weight: 500; margin-bottom: 7px; }
.input, select.input, textarea.input { width: 100%; height: 46px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); font-size: 14.5px; outline: none; transition: border-color .12s, box-shadow .12s; }
textarea.input { height: auto; min-height: 78px; padding: 11px 13px; resize: vertical; }
.input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(31, 107, 69, .14); }
.input.num { font-family: var(--mono); text-align: right; font-size: 16px; }
.input:disabled { background: var(--tint); color: var(--ink-2); }
.input.bad { border-color: var(--danger); }
.err { color: var(--danger); font-size: 12.5px; margin-top: 5px; min-height: 0; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
.field-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 14px; }
.field-grid .span2 { grid-column: span 2; }
.field-grid .span3 { grid-column: 1 / -1; }
.step { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 28px 0 12px; }

.type-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.type-card { text-align: left; padding: 14px 14px 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); cursor: pointer; min-height: 88px; }
.type-card b { display: block; font-size: 15.5px; font-weight: 600; margin-bottom: 4px; }
.type-card span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.type-card:hover { border-color: #c4baa9; }
.type-card.on { border: 2px solid var(--green); background: var(--green-soft); padding: 13px 13px 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { height: 44px; padding: 0 18px; border: 1px solid var(--line-strong); border-radius: 22px; background: var(--surface); cursor: pointer; font-size: 15px; white-space: nowrap; }
.chip:hover { border-color: #c4baa9; }
.chip.on { border: 2px solid var(--green); background: var(--green-soft); font-weight: 600; padding: 0 17px; }
.chip.sm { height: 40px; font-size: 14.5px; }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search { position: relative; margin-left: auto; }
.search input { height: 44px; width: 272px; border-radius: 22px; padding-left: 40px; }
.search svg { position: absolute; left: 15px; top: 13px; width: 17px; height: 17px; color: var(--muted); }
.pill-select { position: relative; }
.pill-select select { appearance: none; height: 44px; padding: 0 38px 0 16px; border-radius: 22px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; cursor: pointer; font-size: 15px; }
.pill-select::after { content: ''; position: absolute; right: 16px; top: 19px; border: 4.5px solid transparent; border-top: 5px solid var(--ink); pointer-events: none; }

/* ------------------------------------------------------------------ tables */
.table-wrap { overflow: auto; border-radius: var(--radius); }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 18px 12px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t th:first-child, table.t td:first-child { padding-left: 18px; }
table.t th:last-child, table.t td:last-child { padding-right: 18px; }
table.t .auto { background: var(--tint); }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: #fbf9f5; }
table.t tr.clickable:hover td.auto { background: #f1ebe2; }
table.t td.num, table.t th.num { text-align: right; }
table.t tfoot td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; }
.edit-btn { width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.edit-btn:hover { background: var(--sunk); }
.edit-btn svg { width: 17px; height: 17px; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.b-Income { background: #e3f1e7; color: var(--green-ink); }
.b-Expense { background: var(--rust-soft); color: var(--rust); }
.b-Cash-Advance { background: var(--blue-soft); color: var(--blue); }
.b-Liquidation { background: #fde7d1; color: #b4621b; }
.b-Return { background: #e6edf8; color: #3a5f9e; }
.b-Replenishment { background: var(--violet-soft); color: var(--violet); }
.badge.late { background: var(--amber-soft); color: var(--amber); font-size: 11px; padding: 2px 8px; margin-left: 6px; }
.badge.ok { background: #e3f1e7; color: var(--green-ink); }
.badge.wait { background: var(--amber-soft); color: var(--amber); }
.badge.pend { background: #efeae2; color: var(--muted); }
.badge.info { background: var(--blue-soft); color: var(--blue); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }

.empty { padding: 50px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ------------------------------------------------------------------ encode */
.goes { padding: 22px 24px 20px; }
.goes h2 { font-size: 19px; margin-bottom: 16px; }
.goes .inset { margin-bottom: 14px; }
.goes .inset small { display: block; font-size: 12.5px; color: #c4d3c9; margin-bottom: 4px; }
.goes .inset .line { font-size: 15.5px; font-weight: 500; }
.goes .inset .amt { font-family: var(--mono); font-weight: 500; color: var(--gold); margin-left: 4px; }
.goes .inset .bal { font-family: var(--mono); font-size: 16px; }
.goes .inset .bal b { font-weight: 500; color: #fff; }
.goes .inset.off { opacity: .72; }
.goes p { margin: 6px 0 0; font-size: 13.5px; color: #c4d3c9; }
.recent { padding: 22px 22px 8px; }
.recent-head { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.recent-head h2 { font-size: 17px; }
.recent-row { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.recent-row:last-child { border-bottom: 0; }
.recent-row b { display: block; font-weight: 500; font-size: 15px; }
.recent-row small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.recent-row .num { margin-left: auto; font-size: 15px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 26px; align-items: center; }
.form-actions .left { margin-right: auto; }

/* ------------------------------------------------------------------ cashflow */
.date-nav { display: flex; align-items: center; height: 46px; border: 1px solid var(--line-strong); border-radius: 24px; background: var(--surface); }
.date-nav button { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--ink-2); border-radius: 50%; }
.date-nav button:disabled { opacity: .3; cursor: default; }
.date-nav .label { position: relative; min-width: 200px; text-align: center; font-weight: 600; padding: 0 8px; cursor: pointer; }
.date-nav .label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.cf-sec { padding: 22px 22px 10px; }
.cf-sec h2 { margin-bottom: 8px; }
.cf-sec table.t th:first-child, .cf-sec table.t td:first-child { padding-left: 8px; }
.cf-sec table.t th:last-child, .cf-sec table.t td:last-child { padding-right: 8px; }
.cf-sec tr.begin td { background: var(--tint); }
.cf-sec .total-row { display: flex; justify-content: flex-end; gap: 16px; padding: 16px 8px 12px; font-weight: 700; align-items: baseline; }
.cf-sec .total-row .mono { font-size: 16px; }
.count-card { padding: 24px 22px 18px; }
.count-table td { padding: 6px 6px; }
.count-table .input { height: 36px; }
.count-table .input { height: 40px; width: 76px; text-align: right; font-family: var(--mono); }
.count-table td:last-child { text-align: right; font-family: var(--mono); }
.count-table tfoot td { padding-top: 14px; font-weight: 700; }
.close-card { padding: 24px 22px; }
.close-card h2 { margin-bottom: 10px; }
.close-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 15.5px; }
.close-row .mono { font-size: 15.5px; }
.close-row.hl { background: var(--forest-2); border-radius: 12px; padding: 13px 14px; margin: 8px 0 16px; font-weight: 700; }
.close-row.final { border-top: 1px solid var(--forest-line); margin-top: 14px; padding-top: 18px; font-weight: 700; }
.close-row.final .mono { color: var(--gold); font-size: 21px; font-weight: 500; }
.close-card textarea.input { background: var(--forest-2); border-color: var(--forest-line); color: #fff; }
.close-card textarea.input::placeholder { color: #8ea596; }
.close-card textarea.input:disabled { background: var(--forest-2); color: #c7d6cc; }
.signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 22px 22px 20px; }
.signs small { color: var(--muted); font-size: 13px; }
.signs b { display: block; text-transform: uppercase; font-size: 15px; margin-top: 6px; letter-spacing: .01em; }
.signs .role { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
.signs .when { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.signs .act { margin-top: 10px; }
.note-card { padding: 16px 20px; font-size: 14px; color: var(--ink-2); }
.saving { font-size: 12px; color: var(--muted); }

/* ------------------------------------------------------------------ report */
.report-wrap { overflow: auto; max-height: calc(100vh - 290px); min-height: 360px; border-radius: var(--radius); }
table.rep { border-collapse: separate; border-spacing: 0; font-size: 13.5px; min-width: 100%; }
table.rep th, table.rep td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.rep thead th { position: sticky; background: var(--surface); z-index: 2; font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: right; white-space: normal; vertical-align: bottom; min-width: 104px; line-height: 1.3; }
table.rep thead tr.band th.stick { text-transform: none; letter-spacing: 0; font-size: 13.5px; }
table.rep th.band-expense span, table.rep th.band-income span { position: sticky; left: 140px; padding: 0 16px; }
table.rep thead tr.band th { top: 0; height: 46px; text-align: center; vertical-align: middle; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
table.rep thead tr.cols th { top: 46px; }
table.rep th.band-income { background: #e5f1e9; color: var(--green-ink); }
table.rep th.band-expense { background: #fbe6db; color: var(--rust); }
table.rep th.band-summary { background: #e3e8e4; color: var(--forest); }
table.rep .stick { position: sticky; left: 0; z-index: 3; background: var(--surface); text-align: left; min-width: 120px; border-right: 1px solid var(--line); }
table.rep thead .stick { z-index: 4; vertical-align: middle; font-size: 13.5px; color: var(--ink); font-weight: 700; }
table.rep td { text-align: right; font-family: var(--mono); color: var(--ink); }
table.rep td.zero { color: var(--faint); }
table.rep td.stick { font-family: var(--sans); }
table.rep tr.has td.stick { font-weight: 700; }
table.rep .col-total { background: #f1f7f3; font-weight: 500; }
table.rep .col-sum { background: #f2f4f2; font-weight: 500; }
table.rep tfoot td { position: sticky; bottom: 0; background: #f1ebe2; font-weight: 700; z-index: 2; border-bottom: 0; }
table.rep tfoot td.stick { background: #f1ebe2; z-index: 3; }
table.rep .divider { border-left: 1px solid var(--line); }
table.rep td.neg { color: var(--rust); }

/* ------------------------------------------------------------------ advances */
.adv { padding: 22px 24px; border-color: #ecc39f; border-width: 1.5px; margin-bottom: 14px; }
.adv-head { display: flex; justify-content: space-between; gap: 12px; }
.adv-head .mono { color: var(--ink-2); font-size: 14px; }
.adv h3 { font-size: 18px; margin: 4px 0 4px; font-weight: 700; }
.bar { height: 8px; border-radius: 6px; background: #f0e9df; overflow: hidden; display: flex; margin: 20px 0 16px; }
.bar i { display: block; height: 100%; }
.bar .liq { background: var(--green); }
.bar .ret { background: #8cc6a1; }
.adv-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.adv-nums small { display: block; font-size: 12.5px; color: var(--ink-2); }
.adv-nums .mono { font-size: 16.5px; }
.adv-actions { display: flex; gap: 10px; margin-top: 18px; }
.settled { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 28px; padding: 24px; margin-bottom: 14px; }
.settled h3 { font-size: 18px; margin: 14px 0 12px; }
.timeline { position: relative; padding-left: 30px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 6px; width: 1px; background: var(--line-strong); }
.tl { position: relative; display: flex; gap: 12px; padding-bottom: 18px; }
.tl:last-child { padding-bottom: 0; }
.tl::before { content: ''; position: absolute; left: -29px; top: 4px; width: 13px; height: 13px; border-radius: 50%; background: #5a5650; }
.tl.Liquidation::before { background: var(--green); }
.tl.Return::before { background: #8cc6a1; }
.tl b { display: block; font-weight: 600; }
.tl small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.tl .mono { margin-left: auto; white-space: nowrap; }

/* ------------------------------------------------------------------ log */
.log-row { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.log-row:last-child { border-bottom: 0; }
.log-row .avatar { width: 38px; height: 38px; background: #e8f2ec; color: var(--green); font-size: 12px; }
.log-row .avatar.sys { background: #f1ebe2; color: #7a6a52; }
.log-row .avatar.r-admin { background: #e7ebf6; color: #43568f; }
.log-row .avatar.r-president { background: #f3e9df; color: #8a5a2b; }
.log-row .t { font-size: 15px; }
.log-row .t b { font-weight: 600; }
.log-row .d { font-size: 13.5px; color: var(--ink-2); margin-top: 3px; }
.log-row .w { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.ctl { margin-bottom: 12px; }
.ctl b { display: block; font-size: 15px; }
.ctl span { display: block; font-size: 13px; color: #c4d3c9; margin-top: 2px; }
.ctl .btn { margin-top: 10px; }
.user-row { display: flex; justify-content: space-between; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; }
.user-row span { color: var(--muted); }

/* ------------------------------------------------------------------ backup */
.ok-card { display: flex; align-items: center; gap: 18px; padding: 22px; margin-bottom: 14px; }
.ok-card .check { width: 52px; height: 52px; border-radius: 12px; background: var(--forest-2); display: grid; place-items: center; flex-shrink: 0; }
.ok-card .check svg { width: 22px; height: 22px; }
.ok-card b { display: block; font-size: 19px; }
.ok-card span { color: #c4d3c9; font-size: 14.5px; }
.ok-card.warn { background: #6b4a12; border-color: #6b4a12; }
.ok-card.warn .check { background: #80591a; }
.dest { display: flex; align-items: center; gap: 14px; padding: 16px 16px; border: 1px solid var(--line-strong); border-radius: 14px; margin-top: 14px; }
.dest.on { border: 2px solid var(--green); background: var(--green-soft); padding: 15px; }
.dest b { display: block; font-weight: 600; font-size: 15px; }
.dest small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.dest .right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.toggle input { width: 22px; height: 22px; accent-color: var(--green); cursor: pointer; }
.bk-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.bk-row b { display: block; font-weight: 600; font-size: 15px; }
.bk-row small { display: block; color: var(--muted); font-size: 12.5px; }
.bk-row .btns { margin-left: auto; display: flex; gap: 6px; }

/* ------------------------------------------------------------------ login */
.login { display: grid; grid-template-columns: 52fr 48fr; min-height: 100vh; }
.login-art { background: var(--forest); color: #fff; padding: 64px 72px 64px; display: flex; flex-direction: column; }
.login-art .brand img { width: 74px; height: 74px; }
.login-art .brand b { font-size: 19px; }
.login-art .brand small { color: #c4d3c9; font-size: 14.5px; }
.login-art h1 { font-size: 44px; line-height: 1.12; letter-spacing: -.04em; margin: auto 0 22px; max-width: 520px; }
.login-art p { color: #d6e1d9; font-size: 17px; max-width: 490px; margin: 0 0 auto; }
.login-art .pills { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 40px; }
.login-art .pills span { background: var(--forest-2); padding: 9px 14px; border-radius: 20px; font-size: 14px; }
.login-form { display: grid; place-items: center; padding: 40px; }
.login-form form { width: 100%; max-width: 400px; }
.login-form h2 { font-size: 30px; margin-bottom: 6px; }
.login-form .lead { color: var(--muted); margin: 0 0 22px; }
.login-form .input { height: 50px; border-radius: 12px; }
.login-form .btn { width: 100%; height: 52px; margin-top: 18px; }
.login-form .help { margin-top: 18px; background: #f1ebe2; border-radius: 12px; padding: 14px; font-size: 13px; color: var(--ink-2); }
.login-form .help p { margin: 0; }
.login-form .help p + p { margin-top: 8px; }
.form-error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 14px; }

/* ------------------------------------------------------------------ settings */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.cat-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.cat-row .grow { flex: 1; }
.cat-row.off .grow { color: var(--faint); text-decoration: line-through; }

/* ------------------------------------------------------------------ modal / toast */
.modal-bg { position: fixed; inset: 0; background: rgba(25, 22, 15, .42); display: grid; place-items: center; z-index: 100; padding: 20px; animation: fade .12s; }
.modal { background: var(--surface); border-radius: 20px; width: 100%; max-width: 480px; padding: 26px 28px 22px; box-shadow: var(--shadow-pop); max-height: calc(100vh - 40px); overflow: auto; }
.modal.wide { max-width: 640px; }
.modal h2 { font-size: 21px; margin-bottom: 8px; }
.modal p { color: var(--ink-2); margin: 0 0 14px; }
.modal ul { color: var(--ink-2); padding-left: 20px; }
.modal .form-actions { margin-top: 20px; }
.modal .secret { font: 500 22px var(--mono); background: var(--tint); padding: 14px; border-radius: 12px; text-align: center; letter-spacing: .02em; user-select: all; }
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; }
.toast { background: var(--forest); color: #fff; padding: 13px 20px; border-radius: 12px; box-shadow: var(--shadow-pop); font-size: 14.5px; animation: up .18s; }
.toast.bad { background: var(--danger); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
.loading { padding: 80px; text-align: center; color: var(--muted); }

/* ------------------------------------------------------------------ responsive */
@media (max-width: 1280px) {
  .topbar { padding: 12px 20px; gap: 14px; }
  .tabs a { padding: 9px 12px; font-size: 14px; }
  .status span.txt { display: none; }
  main, .banner { padding-left: 24px; padding-right: 24px; }
  .grid-2, .grid-cf { grid-template-columns: minmax(0, 1fr) 380px; }
}
@media (max-width: 1060px) {
  .brand div { display: none; }
  .user-chip > div { display: none; }
  .user-chip { padding: 4px; }
  .grid-2, .grid-cf, .settings-grid, .settled { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .login { grid-template-columns: 1fr; }
  .login-art { padding: 36px; }
  .login-art h1 { margin-top: 40px; font-size: 34px; }
}
@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; }
  .tabs { order: 3; width: 100%; overflow-x: auto; }
  .type-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-grid { grid-template-columns: 1fr; }
  .field-grid .span2 { grid-column: auto; }
  .stats, .stats.three { grid-template-columns: 1fr; }
  .page-head { flex-wrap: wrap; }
  .search input { width: 100%; }
  .signs, .adv-nums { grid-template-columns: 1fr 1fr; }
}

/* ------------------------------------------------------------------ print */
.print-only { display: none; }
@media print {
  @page { margin: 12mm; }
  body { background: #fff; }
  .topbar, .banner, main, .toasts, .modal-bg { display: none !important; }
  .print-only { display: block !important; }
}
.sheet { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 10.5pt; }
.sheet .head { display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; text-align: center; margin-bottom: 10px; }
.sheet .head img { width: 62px; height: 62px; }
.sheet .head .n { font-size: 10pt; }
.sheet .head .a { font-size: 9.5pt; }
.sheet .title { text-align: center; font-weight: 700; font-size: 12pt; margin: 6px 0 12px; }
.sheet table { width: 100%; border-collapse: collapse; }
.sheet td, .sheet th { padding: 3px 6px; font-size: 9.5pt; vertical-align: top; }
.sheet th { font-weight: 700; text-align: left; }
.sheet .r { text-align: right; white-space: nowrap; }
.sheet .u { text-decoration: underline; font-weight: 700; }
.sheet .tot { font-weight: 700; }
.sheet .dbl { border-bottom: 3px double #000; }
.sheet .boxed td, .sheet .boxed th { border: 1px solid #000; }
.sheet .sig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 28px; font-size: 9.5pt; }
.sheet .sig .line { margin-top: 30px; font-weight: 700; text-transform: uppercase; }
.sheet .stamp { font-size: 8pt; color: #444; margin-top: 2px; }
.sheet.rep td, .sheet.rep th { border: 1px solid #000; font-size: 6.6pt; padding: 2px 3px; text-align: right; }
.sheet.rep th { text-align: center; font-weight: 700; vertical-align: middle; }
.sheet.rep td:first-child { text-align: left; }
.sheet .foot-note { margin-top: 10px; font-size: 8.5pt; color: #333; }
.menu small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.sheet.rep table { table-layout: fixed; width: 100%; }
.sheet.rep th, .sheet.rep td { font-size: 6.2pt; overflow-wrap: anywhere; }
.sheet.rep th:first-child, .sheet.rep td:first-child { width: 48px; }
.sheet.rep th { font-size: 5.5pt; overflow-wrap: normal; hyphens: manual; }

/* Online trial additions: time-left pill, test accounts on the sign-in page, and the end screen. */
.trial-pill { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 150;
  display: flex; gap: 8px; align-items: baseline; padding: 8px 14px; border-radius: 999px;
  background: var(--forest); color: var(--forest-ink); font-size: 13px; box-shadow: var(--shadow-pop); }
.trial-pill b { color: var(--gold); font-weight: 600; letter-spacing: .02em; }
.trial-pill span { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.trial-accounts { margin-top: 18px; padding: 14px 16px; border-radius: var(--radius-sm); background: var(--green-soft); font-size: 13.5px; color: var(--ink-2); }
.trial-accounts p { margin: 0 0 8px; }
.trial-accounts .who { display: flex; flex-wrap: wrap; gap: 8px; }
.trial-accounts button { display: grid; gap: 1px; text-align: left; padding: 7px 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.trial-accounts button:hover { border-color: var(--green); }
.trial-accounts button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.trial-accounts button small { color: var(--muted); font-size: 12px; }

.trial-ended { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; padding: 24px 16px;
  background: var(--forest); color: var(--forest-ink); overflow-y: auto; }
.trial-card { max-width: 520px; display: grid; gap: 14px; }
.trial-card img { width: 64px; height: 64px; object-fit: contain; }
.trial-card h1 { font-size: 30px; color: #fff; text-wrap: balance; }
.trial-card p { margin: 0; line-height: 1.6; }
.trial-card .trial-note { color: var(--gold); font-weight: 600; }

</style>
</head>

/* Shared helpers, API access, routing and the app shell. Views register themselves in VC.views. */
const VC = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);

  /** Tagged template that escapes interpolations unless they came from html`` or raw(). */
  function html(strings, ...vals) {
    let out = strings[0];
    vals.forEach((v, i) => { out += flat(v) + strings[i + 1]; });
    return { __html: out };
  }
  function flat(v) {
    if (v == null || v === false) return '';
    if (Array.isArray(v)) return v.map(flat).join('');
    if (typeof v === 'object' && '__html' in v) return v.__html;
    return esc(v);
  }
  const raw = (s) => ({ __html: s });
  const render = (el, tpl) => { el.innerHTML = flat(tpl); return el; };

  // ---------------------------------------------------------------- formatting
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const MON = MONTHS.map((m) => m.slice(0, 3));
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const parts = (d) => d.slice(0, 10).split('-').map(Number);
  const dow = (d) => { const [y, m, dd] = parts(d); return new Date(Date.UTC(y, m - 1, dd)).getUTCDay(); };
  const fmt = {
    short: (d) => (d ? `${MON[parts(d)[1] - 1]} ${d.slice(8, 10)}` : ''),
    long: (d) => `${MONTHS[parts(d)[1] - 1]} ${d.slice(8, 10)}, ${d.slice(0, 4)}`,
    full: (d) => `${DAYS[dow(d)]}, ${MON[parts(d)[1] - 1]} ${d.slice(8, 10)}, ${d.slice(0, 4)}`,
    dayShort: (d) => `${DAYS[dow(d)].slice(0, 3)}, ${MON[parts(d)[1] - 1]} ${d.slice(8, 10)}`,
    month: (m) => `${MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`,
    time(ts) {
      const [h, mi] = ts.slice(11, 16).split(':').map(Number);
      return `${((h + 11) % 12) + 1}:${String(mi).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`;
    },
    when: (ts) => `${fmt.dayShort(ts)} · ${fmt.time(ts)}`,
    cents(c) {
      const neg = c < 0; const a = Math.abs(Math.round(c));
      return (neg ? '-' : '') + Math.floor(a / 100).toLocaleString('en-US') + '.' + String(a % 100).padStart(2, '0');
    },
    /** "1234.5" / "1,234.50" -> cents, NaN if invalid */
    toCents(v) {
      const s = String(v ?? '').replace(/[,\s₱]/g, '');
      if (!/^\d+(\.\d{0,2})?$/.test(s)) return NaN;
      const [i, f = ''] = s.split('.');
      return parseInt(i, 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
    },
    /** "Irish Jane V. Balongcas" -> "IB": first name and surname, skipping middle initials. */
    initials(name) {
      const w = (name || '?').split(/\s+/).filter((x) => /^[A-Za-z]/.test(x) && !/^[A-Z]\.$/.test(x));
      return ((w[0]?.[0] || '?') + (w.length > 1 ? w[w.length - 1][0] : '')).toUpperCase();
    },
  };
  const addDays = (d, n) => { const [y, m, dd] = parts(d); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); };
  const pad = (n) => String(n).padStart(2, '0');
  const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

  // ---------------------------------------------------------------- icons
  const icon = {
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 19h14"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5m0 3.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
  };

  // ---------------------------------------------------------------- API
  class ApiError extends Error {
    constructor(status, data) { super(data?.error || `Error ${status}`); this.status = status; this.data = data || {}; }
  }
  async function api(method, url, body, { raw: rawBody } = {}) {
    const opt = { method, headers: {} };
    if (rawBody) { opt.body = rawBody; opt.headers['Content-Type'] = 'application/octet-stream'; }
    else if (body !== undefined) { opt.body = JSON.stringify(body); opt.headers['Content-Type'] = 'application/json'; }
    let res;
    try { res = await fetch(url, opt); } catch {
      throw new ApiError(0, { error: 'Cannot reach the cashbook program on the cashier\'s computer. Make sure it is running.' });
    }
    let data = null;
    try { data = await res.json(); } catch { /* empty */ }
    if (res.status === 401 && !url.endsWith('/api/login')) { state.me = null; showLogin(); throw new ApiError(401, data); }
    if (res.status === 403 && data?.mustChange) { state.me && (state.me.must_change = true); showLogin(); throw new ApiError(403, data); }
    if (!res.ok) throw new ApiError(res.status, data);
    return data;
  }

  // ---------------------------------------------------------------- toasts & dialogs
  function toast(msg, bad = false) {
    const el = document.createElement('div');
    el.className = 'toast' + (bad ? ' bad' : '');
    el.textContent = msg;
    $('#toasts').append(el);
    setTimeout(() => el.remove(), bad ? 6000 : 3200);
  }
  function fail(e) {
    if (e?.status === 401 || e?.data?.mustChange) return;
    toast(e?.message || String(e), true);
  }

  /** Opens a modal. `setup(el, close)` wires it up; resolves with whatever close() is called with. */
  function modal(tpl, setup, { wide = false } = {}) {
    return new Promise((resolve) => {
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      render(bg, html`<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${tpl}</div>`);
      document.body.append(bg);
      const prevFocus = document.activeElement;
      const close = (v) => { bg.remove(); document.removeEventListener('keydown', onKey); prevFocus?.focus?.(); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') close(null); };
      document.addEventListener('keydown', onKey);
      bg.addEventListener('mousedown', (e) => { if (e.target === bg) close(null); });
      $$('[data-close]', bg).forEach((b) => b.addEventListener('click', () => close(null)));
      setup?.(bg, close);
      const first = $('input, textarea, select', bg) || $('.btn.primary, .btn.danger', bg);
      first?.focus();
    });
  }

  function confirmDialog({ title, body, ok = 'Continue', danger = false, list }) {
    return modal(html`<h2>${title}</h2>${body ? html`<p>${body}</p>` : ''}${list ? html`<ul>${list.map((l) => html`<li>${l}</li>`)}</ul>` : ''}
      <div class="form-actions"><button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-ok>${ok}</button></div>`,
    (el, close) => $('[data-ok]', el).addEventListener('click', () => close(true))).then(Boolean);
  }

  function promptDialog({ title, body, label, placeholder = '', ok = 'Save', danger = false, multiline = false, required = true }) {
    return modal(html`<h2>${title}</h2>${body ? html`<p>${body}</p>` : ''}
      <form><label class="f">${label}</label>
      ${multiline ? html`<textarea class="input" name="v" placeholder="${placeholder}"></textarea>` : html`<input class="input" name="v" placeholder="${placeholder}" autocomplete="off">`}
      <div class="err"></div>
      <div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger solid' : 'primary'}">${ok}</button></div></form>`,
    (el, close) => {
      $('form', el).addEventListener('submit', (e) => {
        e.preventDefault();
        const v = $('[name=v]', el).value.trim();
        if (required && !v) { $('.err', el).textContent = 'This is required.'; return; }
        close(v);
      });
    });
  }

  function showFieldErrors(form, fields = {}) {
    $$('.bad', form).forEach((el) => el.classList.remove('bad'));
    $$('.err[data-for]', form).forEach((el) => { el.textContent = ''; });
    for (const [k, msg] of Object.entries(fields)) {
      const input = form.querySelector(`[name="${k}"]`);
      input?.classList.add('bad');
      const err = form.querySelector(`.err[data-for="${k}"]`);
      if (err) err.textContent = msg;
    }
  }

  /** Runs a save; when the server asks for confirmation (409 + warnings) asks the user and retries. */
  async function saveWithConfirm(send) {
    try {
      return await send(false);
    } catch (e) {
      if (e.status === 409 && e.data?.warnings?.length) {
        const ok = await confirmDialog({ title: 'Please check before saving', list: e.data.warnings, ok: 'Save anyway' });
        if (!ok) return null;
        return send(true);
      }
      throw e;
    }
  }

  // ---------------------------------------------------------------- printing
  function printSheet(tpl, { title, landscape = false } = {}) {
    const el = $('#print-area');
    render(el, tpl);
    let style = $('#print-page');
    if (!style) { style = document.createElement('style'); style.id = 'print-page'; document.head.append(style); }
    style.textContent = `@media print { @page { size: ${landscape ? 'A4 landscape' : 'A4 portrait'}; margin: ${landscape ? '8mm' : '12mm'}; } }`;
    const old = document.title;
    if (title) document.title = title;
    const done = () => { document.title = old; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    // Give the logo a moment to load before the print dialog snapshots the page.
    setTimeout(() => window.print(), 150);
  }

  function sheetHead(title) {
    const i = state.meta.institute;
    return html`<div class="head"><img src="${VC_LOGO}" alt=""><div><div class="n">${i.name}</div><div class="a">${i.address}</div><div class="a">${i.contact}</div></div><div></div></div>
      <div class="title">${title}</div>`;
  }

  // ---------------------------------------------------------------- state, shell, router
  const state = { me: null, meta: null, status: null, cleanup: null };
  const views = {};
  const can = {
    encode: () => ['cashier', 'admin'].includes(state.me?.role),
    admin: () => state.me?.role === 'admin',
  };

  const TABS = [
    ['encode', 'Encode', () => can.encode()],
    ['sheet', 'Encoding Sheet', () => true],
    ['cashflow', 'Daily Cashflow', () => true],
    ['report', 'Financial Report', () => true],
    ['advances', 'Cash Advances', () => true],
  ];

  function defaultRoute() { return can.encode() ? '#/encode' : '#/cashflow'; }

  function shell() {
    const me = state.me;
    render($('#app'), html`
      <header class="topbar">
        <a class="brand" href="${defaultRoute()}"><img src="${VC_LOGO}" alt="Valiant Technical Institute logo">
          <div><b>Valiant Cashbook</b><small>Valiant Technical Institute</small></div></a>
        <nav class="tabs" id="tabs">${TABS.filter((t) => t[2]()).map(([k, label]) => html`<a href="#/${k}" data-tab="${k}">${label}</a>`)}</nav>
        <div class="top-right">
          <div class="status" id="status"><span class="dot"></span><span class="txt">Offline</span></div>
          <a class="icon-btn" href="#/log" data-tab="log" title="Change Log" aria-label="Change Log">${raw(icon.clock)}</a>
          <a class="icon-btn" href="#/backup" data-tab="backup" title="Backup & Restore" aria-label="Backup & Restore">${raw(icon.download)}</a>
          <button class="user-chip" id="user-chip" aria-haspopup="true">
            <span class="avatar">${fmt.initials(me.full_name)}</span>
            <div><b>${me.short_name}</b><small>${me.role_label}</small></div>
          </button>
        </div>
      </header>
      <div id="banner"></div>
      <main id="main"></main>`);
    $('#user-chip').addEventListener('click', toggleMenu);
    refreshStatus();
  }

  function toggleMenu(e) {
    e.stopPropagation();

    if (open) { open.remove(); return; }
    const m = document.createElement('div');
    m.className = 'menu';
    render(m, html`<div style="padding:8px 12px 10px"><b style="font-size:14px">${state.me.full_name}</b><small>${state.me.role_label} · ${state.me.username}</small></div><hr>
      <a href="#/settings">Settings${can.admin() ? ' & users' : ''}</a>
      <button data-act="pw">Change password</button><hr>
      <button data-act="out">Sign out</button>`);
    chip.append(m);
    m.addEventListener('click', async (ev) => {
      ev.stopPropagation();

      m.remove();

      if (act === 'out') { await api('POST', '/api/logout').catch(() => {}); state.me = null; location.hash = ''; showLogin(); }
    });

  }

  function changePasswordDialog() {
    return modal(html`<h2>Change password</h2><p>Use at least 8 characters.</p>
      <form><label class="f">Current password</label><input class="input" type="password" name="current" autocomplete="current-password"><div class="err" data-for="current"></div>
      <label class="f" style="margin-top:12px">New password</label><input class="input" type="password" name="next" autocomplete="new-password"><div class="err" data-for="next"></div>
      <div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Change password</button></div></form>`,
    (el, close) => {

      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
          await api('POST', '/api/me/password', { current: f.current.value, next: f.next.value });
          toast('Password changed');
          close(true);
        } catch (err) { showFieldErrors(f, err.data?.fields); if (!err.data?.fields) fail(err); }
      });
    });
  }

  async function refreshStatus() {
    try {
      state.status = await api('GET', '/api/status');
      const s = state.status;
      const el = $('#status');
      if (!el) return;
      const t = s.last_backup ? fmt.time(s.last_backup) : null;
      const txt = s.backed_up_today ? `Offline · backed up ${t}` : s.last_backup ? `Offline · last backup ${fmt.short(s.last_backup)}` : 'Offline · not backed up yet';
      render(el, html`<span class="dot ${s.backed_up_today ? '' : 'warn'}"></span><span class="txt">${txt}</span>`);
      el.title = 'Works without internet. Records stay on this computer.';
    } catch { /* shown elsewhere */ }
  }

  function banner() {
    const el = $('#banner');
    if (!el) return;
    if (!state.meta.opening) {
      const canSet = can.encode();
      render(el, html`<div class="banner"><div><b>Almost ready.</b> Enter the petty cash on hand on the day before you start encoding. Every balance is carried forward from it.
        ${canSet ? html`<a href="#/settings">Set starting balance →</a>` : html`<span style="margin-left:auto">Ask the Cashier or Administrator to set it.</span>`}</div></div>`);
    } else el.innerHTML = '';
  }

  async function loadMeta() { state.meta = await api('GET', '/api/meta'); return state.meta; }

  async function route() {
    if (!state.me) return;
    const hash = location.hash || defaultRoute();
    const [path, qs] = hash.replace(/^#\/?/, '').split('?');
    const [name, ...rest] = path.split('/');
    const view = views[name];
    if (!view || (name === 'encode' && !can.encode())) { location.replace(defaultRoute()); return; }
    if (!$('#main')) shell();
    $$('[data-tab]').forEach((a) => a.classList.toggle('on', a.dataset.tab === name));
    if (state.cleanup) { try { state.cleanup(); } catch { /* ignore */ } state.cleanup = null; }
    const main = $('#main');
    main.className = view.narrow ? 'narrow' : '';
    main.innerHTML = '<div class="loading">Loading…</div>';
    window.scrollTo(0, 0);
    try {
      await loadMeta();
      banner();
      state.cleanup = (await view.render(main, rest, new URLSearchParams(qs || ''))) || null;
    } catch (e) {
      if (e.status === 401 || e.data?.mustChange) return;
      render(main, html`<div class="card pad empty"><b>Could not open this page</b>${e.message}</div>`);
    }
  }

  function showLogin() {
    if (state.cleanup) { try { state.cleanup(); } catch { /* ignore */ } state.cleanup = null; }
    views.login.render($('#app'));
  }

  async function signedIn(user) {
    state.me = user;
    if (user.must_change) return showLogin();
    shell();
    route();
  }

  async function start() {
    window.addEventListener('hashchange', route);
    try {
      const { user } = await api('GET', '/api/me');
      signedIn(user);
    } catch (e) {
      if (e.status !== 401 && !e.data?.mustChange) render($('#app'), html`<div class="loading">${e.message}</div>`);
    }
    setInterval(() => state.me && refreshStatus(), 60000);
  }

  return {
    $, $$, esc, html, raw, render, fmt, addDays, localToday, icon, api, ApiError, toast, fail, modal,
    confirmDialog, promptDialog, showFieldErrors, saveWithConfirm, printSheet, sheetHead,
    state, views, can, refreshStatus, signedIn, showLogin, start, loadMeta, route, changePasswordDialog,
  };
})();
