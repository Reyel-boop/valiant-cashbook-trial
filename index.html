/** Where an entry lands, for the "Where this entry goes" panel. */
function previewTxn(store, row) {
  const cats = categoryMap(store);
  const cat = cats.get(row.category_id);
  const effect = cashEffect(row);
  const out = {};
  if (CASH_IN.includes(row.type)) out.cashflow = { section: 'Cash-In', category: cat?.name, signed: '+' + fmtCents(row.amount_c), tone: 'in' };
  else if (CASH_OUT.includes(row.type)) out.cashflow = { section: 'Cash-Out', category: cat?.name, signed: '-' + fmtCents(row.amount_c), tone: 'out' };
  else out.cashflow = { section: null, note: 'No cash moves today; the money already left as a cash advance.' };

  if (inReport(row)) out.report = { month: MONTHS[+row.txn_date.slice(5, 7) - 1], year: row.txn_date.slice(0, 4), category: cat?.name, signed: '+' + fmtCents(row.amount_c) };
  else if (row.type === 'Income' && row.receipt === 'AR') out.report = { skip: 'AR collections stay in the Cashflow only.' };
  else if (row.type === 'Income') out.report = { skip: 'Only income with an Official Receipt is counted.' };
  else if (row.type === 'Cash Advance') out.report = { skip: 'Not an expense yet. Counted once it is liquidated.' };
  else out.report = { skip: `${row.type}s are not counted in the report.` };

  const ledger = buildLedger(store);
  if (ledger && effect) {
    const before = ledger.closeOf(row.txn_date);
    const dayCount = ledger.days.find((d) => d.day === row.txn_date && d.counted != null);
    const nextCount = ledger.days.find((d) => d.day > row.txn_date && d.counted != null);
    out.balance = {
      day: row.txn_date,
      before: fmtCents(before),
      after: fmtCents(dayCount ? before : before + effect),
      counted: !!dayCount,
      until: nextCount ? nextCount.day : null,
    };
  }
  return out;
}

// ---------------------------------------------------------------- views

function cashflowDay(store, day) {
  const open = requireOpening(store);
  if (!isDate(day)) throw new HttpError(400, 'Bad date.');
  if (day <= open.date) throw new HttpError(400, `The cashbook starts on ${longDay(addDays(open.date, 1))}.`, { firstDay: addDays(open.date, 1) });
  const cats = categoryMap(store);
  const names = userNames(store);
  const ledger = buildLedger(store, day);
  const begin = ledger.closeOf(addDays(day, -1));
  const txns = store.all('SELECT * FROM transactions WHERE voided = 0 AND txn_date = ? ORDER BY id', day).map((t) => shapeTxn(t, cats));
  const cashIn = txns.filter((t) => CASH_IN.includes(t.type));
  const cashOut = txns.filter((t) => CASH_OUT.includes(t.type));
  const noCash = txns.filter((t) => !CASH_IN.includes(t.type) && !CASH_OUT.includes(t.type));
  const cin = cashIn.reduce((s, t) => s + t.amount_c, 0);
  const cout = cashOut.reduce((s, t) => s + t.amount_c, 0);
  const balance = begin + cin - cout;
  const close = store.get('SELECT * FROM day_close WHERE day = ?', day) || null;
  const counted = close && close.counted_total_c != null ? close.counted_total_c : null;
  const onHand = counted != null ? counted : balance;
  const who = (id) => (id && names.get(id) ? names.get(id).full_name : null);
  const signers = {};
  for (const r of ['cashier', 'admin', 'president']) {
    const u = store.get('SELECT full_name FROM users WHERE role = ? AND active = 1 ORDER BY id LIMIT 1', r);
    signers[r] = u ? u.full_name : '';
  }
  return {
    day,
    prev: addDays(day, -1) > open.date ? addDays(day, -1) : null,
    next: day < todayStr() ? addDays(day, 1) : null,
    begin_label: `Petty cash dated ${longDay(addDays(day, -1))}`,
    begin: fmtCents(begin), begin_c: begin,
    cash_in: cashIn, cash_out: cashOut, no_cash: noCash,
    total_in: fmtCents(cin), total_in_c: cin,
    total_cash_in: fmtCents(begin + cin),
    total_out: fmtCents(cout), total_out_c: cout,
    balance: fmtCents(balance), balance_c: balance,
    counts: close && close.counts ? JSON.parse(close.counts) : null,
    counted: counted != null ? fmtCents(counted) : null, counted_c: counted,
    over_short: counted != null ? fmtCents(counted - balance) : null, over_short_c: counted != null ? counted - balance : null,
    explanation: close ? close.explanation : '',
    on_hand: fmtCents(onHand), on_hand_c: onHand,
    status: {
      counted_by: who(close?.counted_by), counted_at: close?.counted_at || null,
      submitted_by: who(close?.submitted_by), submitted_at: close?.submitted_at || null,
      checked_by: who(close?.checked_by), checked_at: close?.checked_at || null,
      approved_by: who(close?.approved_by), approved_at: close?.approved_at || null,
    },
    signers,
    denoms: DENOMS,
  };
}

function financialReport(store, year) {
  if (!/^\d{4}$/.test(String(year))) throw new HttpError(400, 'Bad year.');
  const cats = store.all(`SELECT * FROM categories WHERE kind IN ('income','expense') ORDER BY sort`);
  const used = new Set(store.all(`SELECT DISTINCT category_id FROM transactions t WHERE voided = 0 AND substr(txn_date,1,4) = ? AND ${SQL_IN_REPORT}`, String(year)).map((r) => r.category_id));
  const cols = cats.filter((c) => c.active || used.has(c.id));
  const cells = store.all(`
    SELECT CAST(substr(t.txn_date, 6, 2) AS INTEGER) AS m, t.category_id AS c, SUM(t.amount_c) AS s
    FROM transactions t
    WHERE t.voided = 0 AND substr(t.txn_date, 1, 4) = ? AND ${SQL_IN_REPORT}
    GROUP BY m, c`, String(year));
  const grid = Array.from({ length: 12 }, () => ({}));
  for (const r of cells) grid[r.m - 1][r.c] = r.s;
  const kind = new Map(cols.map((c) => [c.id, c.kind]));
  const months = grid.map((g, i) => {
    let inc = 0, exp = 0;
    for (const [c, s] of Object.entries(g)) {
      if (kind.get(+c) === 'income') inc += s; else exp += s;
    }
    return { month: MONTHS[i], values: g, income_c: inc, expense_c: exp, net_c: inc - exp, has: Object.keys(g).length > 0 };
  });
  const totals = {};
  for (const c of cols) totals[c.id] = months.reduce((s, m) => s + (m.values[c.id] || 0), 0);
  const income = months.reduce((s, m) => s + m.income_c, 0);
  const expense = months.reduce((s, m) => s + m.expense_c, 0);
  const left = store.get(`
    SELECT
      COALESCE(SUM(CASE WHEN type = 'Income' AND receipt = 'AR' THEN amount_c END), 0) AS ar,
      COALESCE(SUM(CASE WHEN type = 'Income' AND receipt NOT IN ('OR','AR') THEN amount_c END), 0) AS other_income,
      COALESCE(SUM(CASE WHEN type = 'Cash Advance' THEN amount_c END), 0) AS advances,
      COALESCE(SUM(CASE WHEN type = 'Return' THEN amount_c END), 0) AS returns
    FROM transactions WHERE voided = 0 AND substr(txn_date, 1, 4) = ?`, String(year));
  const signers = {};
  for (const r of ['cashier', 'admin', 'president']) {
    const u = store.get('SELECT full_name FROM users WHERE role = ? AND active = 1 ORDER BY id LIMIT 1', r);
    signers[r] = u ? u.full_name : '';
  }
  const yearsRow = store.all(`SELECT DISTINCT substr(txn_date,1,4) AS y FROM transactions WHERE voided = 0 ORDER BY y`).map((r) => r.y);
  return {
    year: String(year),
    years: [...new Set([...yearsRow, todayStr().slice(0, 4), String(year)])].sort(),
    columns: cols.map((c) => ({ id: c.id, name: c.name, kind: c.kind, grp: c.grp })),
    months, totals,
    income_c: income, expense_c: expense, net_c: income - expense,
    left_out: { ar_c: left.ar, other_income_c: left.other_income, advances_c: left.advances, returns_c: left.returns },
    signers,
  };
}

function encodingSheet(store, { month, type, late, q }) {
  if (!/^\d{4}-\d{2}$/.test(month || '')) throw new HttpError(400, 'Bad month.');
  const cats = categoryMap(store);
  const where = ['voided = 0', 'substr(txn_date,1,7) = ?'];
  const p = [month];
  if (type && TYPES.includes(type)) { where.push('type = ?'); p.push(type); }
  if (late) where.push('substr(encoded_at,1,10) > txn_date');
  if (q) {
    where.push(`(ref_no LIKE ? OR particulars LIKE ? OR party LIKE ?)`);
    const like = `%${String(q).trim()}%`;
    p.push(like, like, like);
  }
  const rows = store.all(`SELECT * FROM transactions WHERE ${where.join(' AND ')} ORDER BY txn_date, id`, ...p).map((t) => shapeTxn(t, cats));
  // Summary cards always describe the whole month, not just the filtered rows.
  const all = store.all('SELECT * FROM transactions WHERE voided = 0 AND substr(txn_date,1,7) = ?', month);
  let inc = 0, exp = 0, ar = 0;
  for (const t of all) {
    if (!inReport(t)) { if (t.type === 'Income' && t.receipt === 'AR') ar += t.amount_c; continue; }
    if (t.type === 'Income') inc += t.amount_c; else exp += t.amount_c;
  }
  const ledger = buildLedger(store);
  let onHand = null;
  if (ledger) {
    const end = monthEnd(month);
    const asOf = end < todayStr() ? end : todayStr();
    const lastActive = ledger.days.filter((d) => d.day <= asOf && d.day.startsWith(month)).pop();
    const day = lastActive ? lastActive.day : asOf;
    if (day > ledger.open.date) onHand = { day, amount: fmtCents(ledger.closeOf(day)) };
  }
  return {
    month, rows,
    summary: { income: fmtCents(inc), expenses: fmtCents(exp), ar: fmtCents(ar), on_hand: onHand },
  };
}

module.exports = {
  TYPES, RECEIPTS, TYPE_KIND, DENOMS, CASH_IN, CASH_OUT,
  inReport, reportLabel, cashEffect, opening, requireOpening, buildLedger, categoryMap, userNames, shapeTxn,
  nextRef, advanceStatus, listAdvances, validateTxn, previewTxn, cashflowDay, financialReport, encodingSheet,
};

'use strict';
const fs = require('node:fs');
const path = require('node:path');
const { DatabaseSync } = require('node:sqlite');
const { nowStr, hashPassword } = require('./util');

const SCHEMA = `
CREATE TABLE IF NOT EXISTS settings (
  key   TEXT PRIMARY KEY,
  value TEXT
);

CREATE TABLE IF NOT EXISTS users (
  id          INTEGER PRIMARY KEY,
  username    TEXT NOT NULL UNIQUE COLLATE NOCASE,

  active      INTEGER NOT NULL DEFAULT 1,
  created_at  TEXT NOT NULL
);

CREATE TABLE IF NOT EXISTS categories (
  id     INTEGER PRIMARY KEY,
  name   TEXT NOT NULL UNIQUE,
  kind   TEXT NOT NULL CHECK (kind IN ('income','expense','advance','other')),
  grp    TEXT NOT NULL DEFAULT '',
  sort   INTEGER NOT NULL,
  active INTEGER NOT NULL DEFAULT 1
);

CREATE TABLE IF NOT EXISTS transactions (
  id          INTEGER PRIMARY KEY,
  txn_date    TEXT NOT NULL,
  type        TEXT NOT NULL,
  receipt     TEXT NOT NULL,
  ref_no      TEXT NOT NULL DEFAULT '',
  particulars TEXT NOT NULL,
  party       TEXT NOT NULL DEFAULT '',
  category_id INTEGER NOT NULL REFERENCES categories(id),
  amount_c    INTEGER NOT NULL,
  encoded_at  TEXT NOT NULL,
  encoded_by  INTEGER REFERENCES users(id),
  updated_at  TEXT,
  updated_by  INTEGER REFERENCES users(id),
  voided      INTEGER NOT NULL DEFAULT 0,
  void_reason TEXT
);
CREATE INDEX IF NOT EXISTS ix_txn_date ON transactions(txn_date);
CREATE INDEX IF NOT EXISTS ix_txn_ref  ON transactions(ref_no);

CREATE TABLE IF NOT EXISTS day_close (
  day             TEXT PRIMARY KEY,
  counts          TEXT,
  counted_total_c INTEGER,
  explanation     TEXT NOT NULL DEFAULT '',
  counted_by      INTEGER REFERENCES users(id),
  counted_at      TEXT,
  submitted_by    INTEGER REFERENCES users(id),
  submitted_at    TEXT,
  checked_by      INTEGER REFERENCES users(id),
  checked_at      TEXT,
  approved_by     INTEGER REFERENCES users(id),
  approved_at     TEXT
);

CREATE TABLE IF NOT EXISTS cash_checks (
  id         INTEGER PRIMARY KEY,
  check_date TEXT NOT NULL,
  counted_by INTEGER NOT NULL REFERENCES users(id),
  counted_c  INTEGER NOT NULL,
  expected_c INTEGER NOT NULL,
  note       TEXT NOT NULL DEFAULT '',
  created_at TEXT NOT NULL
);

CREATE TABLE IF NOT EXISTS change_log (
  id      INTEGER PRIMARY KEY,
  at      TEXT NOT NULL,
  user_id INTEGER REFERENCES users(id),
  action  TEXT NOT NULL,
  text    TEXT NOT NULL,
  ref     TEXT NOT NULL DEFAULT '',
  detail  TEXT NOT NULL DEFAULT ''
);
CREATE INDEX IF NOT EXISTS ix_log_at ON change_log(at);

CREATE TABLE IF NOT EXISTS backups (
  id           INTEGER PRIMARY KEY,
  at           TEXT NOT NULL,
  filename     TEXT NOT NULL,
  kind         TEXT NOT NULL,
  destinations TEXT NOT NULL DEFAULT '',
  size         INTEGER NOT NULL DEFAULT 0,
  error        TEXT NOT NULL DEFAULT ''
);
`;

// Order matches the Financial Report columns. grp is the header group printed above a column.
const DEFAULT_CATEGORIES = [
  ['Training Fees', 'income', ''],
  ['Assessment Fees', 'income', ''],
  ['Scholarship / Program', 'income', ''],
  ['Other Income', 'income', ''],
  ['Salaries & Wages', 'expense', ''],
  ['13th Month Pay', 'expense', 'Incentives'],

  ['Other Operating Expenses', 'expense', ''],
  ['Professional Fees', 'expense', ''],
  ['Permits, Licenses & Taxes', 'expense', ''],
  ['Supplies & Materials', 'expense', ''],
  ['Tools, Equipment & Repair', 'expense', ''],
  ['Utilities', 'expense', ''],
  ['Cash Advance', 'advance', ''],
  ['Petty Cash Replenishment', 'other', ''],
];

const DEFAULT_SETTINGS = {
  institute_name: 'Valiant Technical Institute and Assessment Center, Inc.',
  institute_address: 'Bangoy Street, Salvacion, Panabo City, Philippines',
  institute_contact: 'Mobile No. : 09106341543, e-mail : valiantpanabocity@yahoo.com.ph',
  opening_date: '',
  opening_balance_c: '',
  backup_time: '17:00',
  backup_usb_path: 'E:\\Valiant Cashbook Backups',
  backup_gdrive_enabled: '0',
  backup_gdrive_path: '',
  backup_keep: '90',
  lan_enabled: '0',
};

// First-run accounts from the proposal. Each must change the temporary password at first sign-in.
const DEFAULT_USERS = [
  ['ibalongcas', 'Irish Jane V. Balongcas', 'Irish Jane', 'cashier'],
  ['jlaurente', 'Jasmine Jeanne V. Laurente', 'Jasmine Jeanne', 'admin'],
  ['jvaliente', 'Joedilito M. Valiente', 'Joedilito', 'president'],
];
const DEFAULT_PASSWORD = 'valiant2025';

class Store {
  constructor(file) {
    this.file = file;
    this.open();
  }

  open() {
    fs.mkdirSync(path.dirname(this.file), { recursive: true });
    this.db = new DatabaseSync(this.file);
    this.db.exec('PRAGMA journal_mode = WAL; PRAGMA foreign_keys = ON; PRAGMA busy_timeout = 5000;');
    this.db.exec(SCHEMA);
    this.seed();
  }

  close() {
    try { this.db.close(); } catch { /* already closed */ }
  }

  get(sql, ...p) { return this.db.prepare(sql).get(...p); }
  all(sql, ...p) { return this.db.prepare(sql).all(...p); }
  run(sql, ...p) { return this.db.prepare(sql).run(...p); }

  tx(fn) {
    this.db.exec('BEGIN IMMEDIATE');
    try {
      const r = fn();
      this.db.exec('COMMIT');
      return r;
    } catch (e) {
      this.db.exec('ROLLBACK');
      throw e;
    }
  }

  setting(key) {
    const r = this.get('SELECT value FROM settings WHERE key = ?', key);
    return r ? r.value : DEFAULT_SETTINGS[key];
  }

  setSetting(key, value) {
    this.run('INSERT INTO settings(key, value) VALUES(?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value', key, String(value));
  }

  settings() {
    const out = { ...DEFAULT_SETTINGS };
    for (const r of this.all('SELECT key, value FROM settings')) out[r.key] = r.value;
    return out;
  }

  seed() {
    if (!this.get('SELECT 1 FROM categories LIMIT 1')) {
      const ins = this.db.prepare('INSERT INTO categories(name, kind, grp, sort) VALUES(?, ?, ?, ?)');
      DEFAULT_CATEGORIES.forEach(([n, k, g], i) => ins.run(n, k, g, (i + 1) * 10));
    }
    if (!this.get('SELECT 1 FROM users LIMIT 1')) {
      const ins = this.db.prepare('INSERT INTO users(username, full_name, short_name, role, pass_hash, must_change, created_at) VALUES(?, ?, ?, ?, ?, 1, ?)');
      for (const [u, f, s, r] of DEFAULT_USERS) ins.run(u, f, s, r, hashPassword(DEFAULT_PASSWORD), nowStr());
      this.firstRun = true;
    }
  }

  log(userId, action, text, ref = '', detail = '') {
    this.run('INSERT INTO change_log(at, user_id, action, text, ref, detail) VALUES(?, ?, ?, ?, ?, ?)',
      nowStr(), userId ?? null, action, text, ref, detail);
  }
}

module.exports = { Store, DEFAULT_PASSWORD, DEFAULT_USERS };

};
defs["api"] = function (module, exports, require) {
'use strict';
const os = require('node:os');
const L = require('./ledger');
const {
  todayStr, nowStr, isDate, toCents, fmtCents, shortDay, longDay, HttpError,
  hashPassword, verifyPassword, tempPassword,
} = require('./util');

const ALL = ['cashier', 'admin', 'president'];
const ENCODERS = ['cashier', 'admin'];
const ROLE_LABEL = { cashier: 'Cashier', admin: 'Administrator', president: 'President' };
const article = (w) => (/^[AEIOU]/i.test(w) ? 'an' : 'a');

function publicUser(u) {
  return { id: u.id, username: u.username, full_name: u.full_name, short_name: u.short_name, role: u.role, role_label: ROLE_LABEL[u.role], must_change: !!u.must_change, active: !!u.active };
}

function lanAddresses(port) {
  const out = [];
  for (const list of Object.values(os.networkInterfaces())) {
    for (const a of list || []) if (a.family === 'IPv4' && !a.internal) out.push(`http://${a.address}:${port}`);
  }
  return out;
}

function createApi({ store, backups, sessions, port }) {
  const routes = [];
  const route = (method, pattern, roles, handler) => {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '$');
    routes.push({ method, pattern, re, keys, roles, handler });
  };

  // ------------------------------------------------------------ helpers

  function resetSignoffs(day, userId) {
    const c = store.get('SELECT * FROM day_close WHERE day = ?', day);
    if (c && (c.submitted_at || c.checked_at || c.approved_at)) {
      store.run('UPDATE day_close SET submitted_by = NULL, submitted_at = NULL, checked_by = NULL, checked_at = NULL, approved_by = NULL, approved_at = NULL WHERE day = ?', day);
      store.log(null, 'system', `cleared the sign-offs on the ${shortDay(day)} Cashflow because its entries changed`, '', 'It needs to be submitted, checked and approved again.');
    }
  }

  function noteLateEntry(day) {
    if (day >= todayStr()) return;
    const recent = store.get(`SELECT 1 FROM change_log WHERE action = 'system' AND ref = ? AND at > ?`, day, nowStr(new Date(Date.now() - 10 * 60000)));
    if (!recent) store.log(null, 'system', `updated balances from ${shortDay(day)} onward after late entries`, day);
  }

  function describeRow(r, cats) {
    return `${fmtCents(r.amount_c)} · ${r.particulars} · ${cats.get(r.category_id)?.name || ''}`;
  }

  function diffRows(a, b, cats) {
    const out = [];
    const f = {
      txn_date: ['Date', (v) => shortDay(v)],
      type: ['Type', (v) => v],
      receipt: ['Receipt', (v) => v],
      ref_no: ['Ref. no.', (v) => v],
      particulars: ['Particulars', (v) => v],
      party: ['Payee / Payor', (v) => v || '—'],
      category_id: ['Category', (v) => cats.get(v)?.name || '?'],
      amount_c: ['Amount', (v) => fmtCents(v)],
    };
    for (const [k, [label, show]] of Object.entries(f)) if (a[k] !== b[k]) out.push({ label, text: `${label} ${show(a[k])} → ${show(b[k])}` });
    return out;
  }

  function requireSigner(user, roles) {
    if (!roles.includes(user.role)) throw new HttpError(403, 'Your role cannot do this.');
  }

  // ------------------------------------------------------------ session

  route('POST', '/api/login', null, ({ body, res, ip }) => {
    const u = store.get('SELECT * FROM users WHERE username = ? AND active = 1', String(body.username || '').trim());
    if (!sessions.allowAttempt(ip)) throw new HttpError(429, 'Too many tries. Wait a minute and try again.');
    if (!u || !verifyPassword(String(body.password || ''), u.pass_hash)) {
      sessions.failed(ip);
      throw new HttpError(401, 'Wrong username or password.');
    }
    const token = sessions.create(u.id);
    res.setHeader('Set-Cookie', `vc_session=${token}; HttpOnly; SameSite=Strict; Path=/`);
    return { user: publicUser(u) };
  });

  route('POST', '/api/logout', ALL, ({ token, res }) => {
    sessions.destroy(token);
    res.setHeader('Set-Cookie', 'vc_session=; HttpOnly; SameSite=Strict; Path=/; Max-Age=0');
    return { ok: true };
  });

  route('GET', '/api/me', ALL, ({ user }) => ({ user: publicUser(user) }));

  route('POST', '/api/me/password', ALL, ({ user, body }) => {
    const u = store.get('SELECT * FROM users WHERE id = ?', user.id);
    if (!verifyPassword(String(body.current || ''), u.pass_hash)) throw new HttpError(400, 'Your current password is wrong.', { fields: { current: 'Wrong password.' } });
    const next = String(body.next || '');
    if (next.length < 8) throw new HttpError(400, 'Use at least 8 characters.', { fields: { next: 'Use at least 8 characters.' } });
    if (next === body.current) throw new HttpError(400, 'Choose a new password.', { fields: { next: 'Choose a different password.' } });
    store.run('UPDATE users SET pass_hash = ?, must_change = 0 WHERE id = ?', hashPassword(next), user.id);
    store.log(user.id, 'user', 'changed their password');
    return { ok: true };
  });

  // ------------------------------------------------------------ reference data

  route('GET', '/api/meta', ALL, () => {
    const s = store.settings();
    const o = L.opening(store);
    return {
      types: L.TYPES,
      receipts: L.RECEIPTS,
      type_kind: L.TYPE_KIND,
      categories: store.all('SELECT id, name, kind, grp, sort, active FROM categories ORDER BY sort'),
      institute: { name: s.institute_name, address: s.institute_address, contact: s.institute_contact },
      opening: o ? { date: o.date, balance: fmtCents(o.balance_c), first_day: require('./util').addDays(o.date, 1) } : null,
      today: todayStr(),
      next_ref: { Expense: L.nextRef(store, 'Expense'), 'Cash Advance': L.nextRef(store, 'Cash Advance') },
    };
  });

  route('GET', '/api/status', ALL, () => {
    const last = backups.last();
    const ledger = L.buildLedger(store);
    return {
      last_backup: last ? last.at : null,
      backed_up_today: !!(last && last.at.startsWith(todayStr())),
      on_hand: ledger ? fmtCents(ledger.closeOf(todayStr())) : null,
      outstanding_advances: L.listAdvances(store).stats.outstanding_count,
    };
  });

  route('GET', '/api/next-ref', ENCODERS, ({ query }) => ({ ref: L.nextRef(store, query.get('type')) }));

  route('GET', '/api/transactions', ALL, ({ query }) => L.encodingSheet(store, {
    month: query.get('month') || todayStr().slice(0, 7),
    type: query.get('type') || '',
    late: query.get('late') === '1',
    q: query.get('q') || '',
  }));

  route('GET', '/api/transactions/recent', ALL, () => {
    const cats = L.categoryMap(store);
    return { rows: store.all('SELECT * FROM transactions WHERE voided = 0 ORDER BY encoded_at DESC, id DESC LIMIT 6').map((t) => L.shapeTxn(t, cats)) };
  });

  route('GET', '/api/transactions/:id', ALL, ({ params }) => {

  route('POST', '/api/transactions/preview', ENCODERS, ({ body }) => {
    try {
      const { row } = L.validateTxn(store, body, +body.id || 0);
      return { ok: true, preview: L.previewTxn(store, row) };
    } catch (e) {
      if (e instanceof HttpError && e.status === 400) return { ok: false, fields: e.extra?.fields || {} };
      throw e;
    }
  });

  route('POST', '/api/transactions', ENCODERS, ({ user, body }) => {
    const { row, warnings } = L.validateTxn(store, body);
    if (warnings.length && !body.confirm) throw new HttpError(409, 'Please confirm.', { warnings });
    const cats = L.categoryMap(store);
    const id = store.tx(() => {
      const r = store.run(`INSERT INTO transactions(txn_date, type, receipt, ref_no, particulars, party, category_id, amount_c, encoded_at, encoded_by)
        VALUES(?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`, row.txn_date, row.type, row.receipt, row.ref_no, row.particulars, row.party, row.category_id, row.amount_c, nowStr(), user.id);
      const newId = Number(r.lastInsertRowid);
      const late = row.txn_date < todayStr();
      store.log(user.id, 'encode', `encoded ${article(row.type)} ${row.type}${late ? ` dated ${shortDay(row.txn_date)}` : ''}`, row.ref_no,
        `${describeRow(row, cats)}${warnings.length ? ' · confirmed: ' + warnings.join(' ') : ''} · #${newId}`);
      resetSignoffs(row.txn_date, user.id);
      noteLateEntry(row.txn_date);
      return newId;
    });
    return { id, txn: L.shapeTxn(store.get('SELECT * FROM transactions WHERE id = ?', id), cats) };
  });

  route('PUT', '/api/transactions/:id', ENCODERS, ({ user, body, params }) => {
    const old = store.get('SELECT * FROM transactions WHERE id = ? AND voided = 0', +params.id);
    if (!old) throw new HttpError(404, 'Entry not found.');
    const reason = String(body.reason || '').trim();
    if (!reason) throw new HttpError(400, 'Say why the entry is being changed.', { fields: { reason: 'Required. It is kept in the Change Log.' } });
    const { row, warnings } = L.validateTxn(store, body, old.id);
    if (warnings.length && !body.confirm) throw new HttpError(409, 'Please confirm.', { warnings });
    const cats = L.categoryMap(store);
    const changes = diffRows(old, row, cats);

    store.tx(() => {
      store.run(`UPDATE transactions SET txn_date = ?, type = ?, receipt = ?, ref_no = ?, particulars = ?, party = ?, category_id = ?, amount_c = ?, updated_at = ?, updated_by = ? WHERE id = ?`,
        row.txn_date, row.type, row.receipt, row.ref_no, row.particulars, row.party, row.category_id, row.amount_c, nowStr(), user.id, old.id);
      const text = changes.length === 1 ? `changed the ${changes[0].label.toLowerCase()} of` : 'edited';
      store.log(user.id, 'edit', text, row.ref_no, `${changes.map((c) => c.text).join(' · ')} · reason: ${reason} · #${old.id}`);

      if (row.txn_date !== old.txn_date) resetSignoffs(row.txn_date, user.id);
      noteLateEntry(row.txn_date < old.txn_date ? row.txn_date : old.txn_date);
    });
    return { id: old.id };
  });

  route('POST', '/api/transactions/:id/void', ENCODERS, ({ user, body, params }) => {
    const old = store.get('SELECT * FROM transactions WHERE id = ? AND voided = 0', +params.id);
    if (!old) throw new HttpError(404, 'Entry not found.');
    const reason = String(body.reason || '').trim();
    if (!reason) throw new HttpError(400, 'Say why the entry is being removed.', { fields: { reason: 'Required. It is kept in the Change Log.' } });
    if (old.type === 'Cash Advance') {
      const linked = store.get(`SELECT COUNT(*) AS n FROM transactions WHERE ref_no = ? AND voided = 0 AND type IN ('Liquidation','Return')`, old.ref_no);
      if (linked.n) throw new HttpError(400, `Remove the ${linked.n} liquidation/return entr${linked.n === 1 ? 'y' : 'ies'} of ${old.ref_no} first.`);
    }

      store.run('UPDATE transactions SET voided = 1, void_reason = ?, updated_at = ?, updated_by = ? WHERE id = ?', reason, nowStr(), user.id, old.id);
      store.log(user.id, 'void', `removed ${article(old.type)} ${old.type} dated ${shortDay(old.txn_date)}`, old.ref_no, `${describeRow(old, cats)} · reason: ${reason} · #${old.id}`);
      resetSignoffs(old.txn_date, user.id);
      noteLateEntry(old.txn_date);
    });
    return { ok: true };
  });

  // ------------------------------------------------------------ daily cashflow

  route('GET', '/api/cashflow/:day', ALL, ({ params }) => L.cashflowDay(store, params.day));

  function parseCount(body) {
    const counts = {};
    let total = 0;
    for (const d of L.DENOMS) {
      const n = body.counts?.[d];
      if (n === '' || n == null) continue;
      const pieces = Number(n);
      if (!Number.isInteger(pieces) || pieces < 0 || pieces > 100000) throw new HttpError(400, `Pieces for ₱${d} must be a whole number.`);
      if (pieces) counts[d] = pieces;
      total += pieces * Number(d) * 100;
    }
    const coins = body.counts?.coins;
    if (coins !== '' && coins != null) {
      const c = toCents(String(coins));
      if (!Number.isFinite(c) || c < 0) throw new HttpError(400, 'Enter the coin amount in pesos, e.g. 0.59');

  route('PUT', '/api/cashflow/:day/count', ENCODERS, ({ user, body, params }) => {

    const { counts, total } = parseCount(body);
    const explanation = String(body.explanation || '').trim().slice(0, 500);
    const empty = !Object.keys(counts).length;
    store.run(`INSERT INTO day_close(day, counts, counted_total_c, explanation, counted_by, counted_at) VALUES(?, ?, ?, ?, ?, ?)

    day, empty ? null : JSON.stringify(counts), empty ? null : total, explanation, user.id, nowStr());
    if (!empty && total !== (cf.counted_c ?? -1)) {

};

  // ---------------------------------------------------------------- sessions (kept for this tab)
  const SESSION_KEY = 'vc_trial_session';
  const sessions = {
    map: new Map(),
    attempts: new Map(),
    create(userId) {
      const token = randHex(24);
      this.map.set(token, { userId, seen: Date.now() });
      ss.set(SESSION_KEY, { token, userId });
      return token;
    },
    lookup(token) { return (token && this.map.get(token)) || null; },
    destroy(token) { this.map.delete(token); ss.del(SESSION_KEY); },
    dropUser(userId) { for (const [t, s] of this.map) if (s.userId === userId) this.map.delete(t); },
    keepOnly(token) { for (const t of [...this.map.keys()]) if (t !== token) this.map.delete(t); },
    allowAttempt() { const a = this.attempts.get('x'); return !a || a.n < 8 || Date.now() - a.t > 60000; },
    failed() {
      const a = this.attempts.get('x');
      if (!a || Date.now() - a.t > 60000) this.attempts.set('x', { n: 1, t: Date.now() });
      else a.n++;
    },
  };
  let currentToken = null;

  // ---------------------------------------------------------------- backups (kept in this browser)
  let store = null;
  const files = new Map(); // filename -> Uint8Array
  let saveTimer = null;

  function snapshot() { return store.db.export(); }

  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { idb.set('db', snapshot()); }, 50);
  }

  class Backups {
    constructor(s) { this.store = s; this.running = false; }
    refreshLabel() {}
    listDrives() { return Promise.resolve([]); }
    destinations() {
      return {
        usb: { path: '', connected: false, drive: '', label: null },
        gdrive: { enabled: false, path: '', ready: false },
        local: { path: 'This browser (online trial)' },
      };
    }
    list(limit = 30) {
      return this.store.all('SELECT * FROM backups ORDER BY at DESC, id DESC LIMIT ?', limit).map((b) => ({ ...b, exists: files.has(b.filename) }));
    }
    last() { return this.store.get(`SELECT * FROM backups WHERE error = '' ORDER BY at DESC, id DESC LIMIT 1`) || null; }
    run(kind = 'manual', userId = null) {
      const { todayStr, nowStr, HttpError } = req('./util');
      if (this.running) throw new HttpError(409, 'A backup is already running.');
      this.running = true;
      try {
        const d = new Date();
        const stamp = `${todayStr(d)}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        const filename = `valiant-cashbook-${stamp}${kind === 'pre-restore' ? '-prerestore' : ''}.db`;
        const bytes = snapshot();
        files.set(filename, bytes);
        idb.set('file:' + filename, bytes);
        this.store.run('INSERT INTO backups(at, filename, kind, destinations, size, error) VALUES(?, ?, ?, ?, ?, ?)',
          nowStr(d), filename, kind, 'This computer', bytes.length, '');
        this.store.log(userId, 'backup', kind === 'auto' ? 'made the daily automatic backup' : kind === 'pre-restore' ? 'saved a safety copy before restoring' : 'backed up the records',
          '', 'This browser (online trial)');
        this.prune();
        return { filename, destinations: ['This computer'], problems: [] };
      } finally { this.running = false; }
    }
    prune() {
      const names = [...files.keys()].sort();
      for (const f of names.slice(0, Math.max(0, names.length - KEEP_BACKUPS))) { files.delete(f); idb.del('file:' + f); }
    }
    tick() {
      const { todayStr, nowStr } = req('./util');
      const time = this.store.setting('backup_time') || '17:00';
      const now = new Date();
      if (`${pad(now.getHours())}:${pad(now.getMinutes())}` < time) return;
      if (this.store.get(`SELECT 1 FROM backups WHERE kind = 'auto' AND error = '' AND substr(at,1,10) = ?`, todayStr(now)) || this.running) return;
      try { this.run('auto', null); } catch (e) {
        this.store.run('INSERT INTO backups(at, filename, kind, destinations, size, error) VALUES(?, ?, ?, ?, ?, ?)', nowStr(), '', 'auto', '', 0, String(e.message || e));
      }
      persist();
    }
    static checkFile(bytes) {
      const { HttpError } = req('./util');
      let db;
      try {
        db = new SQL.Database(normalizeDbBytes(bytes));
        const ok = db.exec(`SELECT COUNT(*) FROM sqlite_master WHERE type = 'table' AND name IN ('transactions','users','categories')`)[0].values[0][0];
        if (ok !== 3) throw new Error('not a cashbook');
        if (db.exec('PRAGMA quick_check')[0].values[0][0] !== 'ok') throw new Error('damaged');
      } catch (e) {
        throw new HttpError(400, `That file is not a usable Valiant Cashbook backup (${e.message}).`);
      } finally { try { db && db.close(); } catch { /* ignore */ } }
    }
    restoreFrom(bytes, userId, label) {
      Backups.checkFile(bytes);
      this.run('pre-restore', userId);
      const history = this.store.all('SELECT at, filename, kind, destinations, size, error FROM backups');
      const started = this.store.setting('trial_started_at');
      this.store.close();
      pendingBytes = bytes;
      this.store.open();
      const have = new Set(this.store.all('SELECT filename FROM backups').map((r) => r.filename));
      for (const b of history) {
        if (b.filename && have.has(b.filename)) continue;
        this.store.run('INSERT INTO backups(at, filename, kind, destinations, size, error) VALUES(?, ?, ?, ?, ?, ?)', b.at, b.filename, b.kind, b.destinations, b.size, b.error);
      }
      this.store.setSetting('trial_started_at', started); // a restored file cannot restart the trial
      this.store.log(userId, 'restore', 'restored the records from a backup', '', label);
    }
    restoreById(id, userId) {
      const { HttpError } = req('./util');
      const b = this.store.get('SELECT * FROM backups WHERE id = ?', id);
      if (!b || !b.filename) throw new HttpError(404, 'Backup not found.');
      const bytes = files.get(b.filename);
      if (!bytes) throw new HttpError(404, 'That backup is no longer kept in this browser.');
      this.restoreFrom(bytes, userId, `${b.filename} (${b.at.replace('T', ' ')})`);
    }
    restoreUpload(buf, userId, name) { this.restoreFrom(buf, userId, `uploaded file ${name || ''}`.trim()); }
    filePath() { return null; }
  }

  // ---------------------------------------------------------------- trial clock
  let startedAt = 0;
  const expiresAt = () => startedAt + TRIAL_MS;
  const expired = () => Date.now() >= expiresAt();

  function startClock() {
    const fromDb = Number(store.setting('trial_started_at')) || 0;
    const fromLs = Number(ls.get('vc_trial_started')) || 0;
    startedAt = Math.min(...[fromDb, fromLs, Date.now()].filter(Boolean));
    store.setSetting('trial_started_at', String(startedAt));
    ls.set('vc_trial_started', String(startedAt));
  }

  // ---------------------------------------------------------------- request handling (mirrors server.js)
  let routes = [];
  let HttpError = null;

  async function handle(method, href, opt) {
    const url = new URL(href, 'http://trial.local/');
    if (expired()) {
      showEnded();
      throw new HttpError(403, 'The 5-day trial has ended.');
    }
    const session = sessions.lookup(currentToken);
    const user = session ? store.get('SELECT * FROM users WHERE id = ? AND active = 1', session.userId) : null;
    for (const r of routes) {
      if (r.method !== method) continue;
      const m = url.pathname.match(r.re);
      if (!m) continue;
      if (r.roles) {
        if (!user) throw new HttpError(401, 'Please sign in.');
        if (user.must_change && !['/api/me/password', '/api/me', '/api/logout'].includes(r.pattern)) {
          throw new HttpError(403, 'Change your temporary password first.', { mustChange: true });
        }
        if (!r.roles.includes(user.role)) throw new HttpError(403, 'Your role cannot do this.');
      }
      const params = {};
      r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
      let body = {};
      let raw = null;
      if (method !== 'GET' && opt.body != null) {
        if (url.pathname === '/api/backup/upload') raw = new Uint8Array(opt.body);
        else { try { body = JSON.parse(opt.body); } catch { throw new HttpError(400, 'Bad request.'); } }
      }
      const res = {
        setHeader(k, v) {
          if (k !== 'Set-Cookie') return;
          const t = /vc_session=([^;]*)/.exec(v)[1];
          currentToken = t || null;
        },
      };
      const out = await r.handler({ req: {}, res, body, raw, params, query: url.searchParams, user, token: currentToken, ip: 'browser' });
      if (method !== 'GET') persist();
      return out ?? { ok: true };
    }
    throw new HttpError(404, 'Not found.');
  }

  function installFetch() {
    const realFetch = window.fetch.bind(window);
    window.fetch = async (input, opt = {}) => {
      const href = typeof input === 'string' ? input : input.url;
      if (!/^\/api\//.test(href)) return realFetch(input, opt);
      const json = (status, obj) => new Response(JSON.stringify(obj), { status, headers: { 'Content-Type': 'application/json' } });
      try {
        return json(200, await handle((opt.method || 'GET').toUpperCase(), href, opt));
      } catch (e) {
        if (e instanceof HttpError) return json(e.status, { error: e.message, ...(e.extra || {}) });
        console.error(e);
        return json(500, { error: 'Something went wrong. ' + (e.message || '') });
      }
    };
  }

  // ---------------------------------------------------------------- trial UI
  function left() {
    const ms = Math.max(0, expiresAt() - Date.now());
    const h = Math.floor(ms / 3600000);
    if (h >= 24) { const d = Math.floor(h / 24); return `${d} day${d === 1 ? "" : "s"} ${h % 24} h left`; }
    if (h >= 1) return `${h} h ${Math.floor((ms % 3600000) / 60000)} min left`;
    return `${Math.max(1, Math.ceil(ms / 60000))} min left`;
  }

  function when(ms) {
    return new Date(ms).toLocaleString('en-PH', { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function drawPill() {
    const el = document.getElementById('trial-pill');
    if (!el) return;
    if (expired()) return showEnded();
    el.hidden = false;
    el.innerHTML = `<b>Online trial</b><span>${left()}</span>`;
    el.title = `Trial ends ${when(expiresAt())}. Records are saved in this browser only.`;
  }

  let endedShown = false;
  function showEnded() {
    if (endedShown) return;
    endedShown = true;
    const pill = document.getElementById('trial-pill');
    if (pill) pill.hidden = true;
    document.querySelectorAll('.modal-bg').forEach((m) => m.remove());
    const el = document.createElement('div');
    el.className = 'trial-ended';
    el.innerHTML = `<div class="trial-card">
      <img src="${VC_LOGO}" alt="Valiant Technical Institute logo">
      <h1>Your 5-day trial has ended</h1>
      <p>You started the online trial on ${when(startedAt)}. It closed on ${when(expiresAt())}.</p>
      <p>The full Valiant Cashbook is installed on the cashier's computer. It runs without internet or a subscription, and keeps daily backups on a USB drive.</p>
      <p class="trial-note">Ask the developer for the installed version to keep using it.</p>
    </div>`;
    document.body.append(el);
    document.getElementById('app').setAttribute('inert', '');
  }

  function wireUi() {
    // Downloads and printing are blocked inside the online trial page.
    // "Save copy" links point at the server's download route; hand the file over from this browser instead.
    document.addEventListener('click', (e) => {
      const a = e.target.closest && e.target.closest('a[href^="/api/"]');
      if (!a) return;
      e.preventDefault();
      const m = /^\/api\/backup\/(\d+)\/download$/.exec(a.getAttribute('href'));
      const b = m && store.get('SELECT filename FROM backups WHERE id = ?', +m[1]);
      const bytes = b && files.get(b.filename);
      if (!bytes) return VC.toast('That backup is no longer kept in this browser.', true);
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
      link.download = b.filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    }, true);
    drawPill();
    setInterval(drawPill, 30000);
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    SQL = await initSqlJs();
    const saved = await idb.open();
    const bytes = saved ? await idb.get('db') : undefined;
    if (bytes) pendingBytes = bytes;
    if (saved) {
      for (const k of (await idb.keys()) || []) {
        if (typeof k === 'string' && k.startsWith('file:')) files.set(k.slice(5), await idb.get(k));
      }
    }
    const { Store } = req('./db');
    ({ HttpError } = req('./util'));
    store = new Store('trial');
    store.file = 'This browser (online trial)';
    // Trial accounts skip the forced password change so testers can switch roles freely.
    if (store.firstRun) store.run('UPDATE users SET must_change = 0');
    const backups = new Backups(store);
    ({ routes } = req('./api').createApi({ store, backups, sessions, port: 0 }));
    startClock();
    persist();
    const s = ss.get(SESSION_KEY);
    if (s && s.token) { sessions.map.set(s.token, { userId: s.userId, seen: Date.now() }); currentToken = s.token; }
    installFetch();
    setInterval(() => backups.tick(), 60000);
    wireUi();
    if (!saved) VC.toast('This browser is not saving records. They will be lost when the page closes.', true);
    if (expired()) { showEnded(); throw new Error('trial ended'); }
  }

  return { boot, sha256 };
})();

document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('[data-trial-user]');
  const f = document.getElementById('f');
  if (!b || !f || !f.username) return;
  f.username.value = b.dataset.trialUser;
  f.password.value = 'valiant2025';
  f.querySelector('button.primary').focus();
});
VCTrial.boot().then(() => VC.start(), (e) => {
  if (e.message === 'trial ended') return;
  console.error(e);
  document.getElementById('app').innerHTML = '<div class="loading">The trial could not start. Check the internet connection and reload the page.</div>';
});
</script>
</body>
